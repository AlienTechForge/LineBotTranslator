name: Repair MinIO application access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    name: Repair and verify MinIO IAM
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Read safe image-translation timings
        run: |
          docker logs --since=6h linebot-translator 2>&1 |
            grep -E 'AI provider execution|Overlay safety evaluated|Translation workflow persisted|收到圖片訊息' |
            tail -n 400 || true
