name: Rotate MongoDB credential

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit first, then run rotate after the replacement secrets are staged
        required: true
        type: choice
        options:
          - audit
          - rotate
      confirmation:
        description: Type ROTATE_EXPOSED_MONGODB_CREDENTIAL
        required: true
        type: string
      mongodb_container:
        description: Optional MongoDB container name when automatic discovery is ambiguous
        required: false
        type: string

permissions:
  contents: read
  packages: read

jobs:
  rotate:
    name: ${{ inputs.mode == 'audit' && 'Audit rotation path' || 'Rotate and redeploy' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        if: inputs.mode == 'rotate'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit or rotate MongoDB credential
        env:
          ROTATION_MODE: ${{ inputs.mode }}
          ROTATION_CONFIRMATION: ${{ inputs.confirmation }}
          MONGODB_CONTAINER_NAME: ${{ inputs.mongodb_container }}
          MONGODB_CURRENT_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_ROTATION_OLD_URI: ${{ secrets.MONGODB_ROTATION_OLD_URI }}
          MONGODB_ROTATION_NEW_URI: ${{ secrets.MONGODB_ROTATION_NEW_URI }}
          MONGODB_ROTATION_OLD_PASSWORD: ${{ secrets.MONGODB_ROTATION_OLD_PASSWORD }}
          MONGODB_ROTATION_NEW_PASSWORD: ${{ secrets.MONGODB_ROTATION_NEW_PASSWORD }}
          ROTATION_USERNAME: ${{ secrets.MONGODB_ROTATION_USERNAME }}
          ROTATION_AUTH_DB: ${{ secrets.MONGODB_ROTATION_AUTH_DB }}
          IMAGE: ghcr.io/alientechforge/linebot-translator:${{ github.sha }}
          # Keep every key below in step with the deploy step of ci-cd.yml; CiQualityGateContractTests
          # fails when the two drift. MONGODB_URI is intentionally absent: the rotation script exports
          # the new URI itself when it calls scripts/deploy.sh.
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'linebot-translator' }}
          DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK || 'host' }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '4040' }}
          HOST_PORT: ${{ vars.HOST_PORT || '4040' }}
          HEALTH_TIMEOUT_SECONDS: ${{ vars.HEALTH_TIMEOUT_SECONDS || '120' }}
          LINE_BOT_CHANNEL_TOKEN: ${{ secrets.LINE_BOT_CHANNEL_TOKEN }}
          LINE_BOT_CHANNEL_SECRET: ${{ secrets.LINE_BOT_CHANNEL_SECRET }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          MONGODB_CONNECT_TIMEOUT_MS: ${{ vars.MONGODB_CONNECT_TIMEOUT_MS || '3000' }}
          MONGODB_READ_TIMEOUT_MS: ${{ vars.MONGODB_READ_TIMEOUT_MS || '5000' }}
          MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${{ vars.MONGODB_SERVER_SELECTION_TIMEOUT_MS || '3000' }}
          MONGODB_HEARTBEAT_FREQUENCY_MS: ${{ vars.MONGODB_HEARTBEAT_FREQUENCY_MS || '5000' }}
          MONGODB_MIN_HEARTBEAT_FREQUENCY_MS: ${{ vars.MONGODB_MIN_HEARTBEAT_FREQUENCY_MS || '500' }}
          TRANSLATION_CACHE_TTL: ${{ vars.TRANSLATION_CACHE_TTL || 'PT30M' }}
          TRANSLATION_CACHE_MAX_ENTRIES: ${{ vars.TRANSLATION_CACHE_MAX_ENTRIES || '1000' }}
          TRANSLATION_GLOSSARY_VERSION: ${{ vars.TRANSLATION_GLOSSARY_VERSION || 'none' }}
          TRANSLATION_ACTION_CLAIM_LEASE: ${{ vars.TRANSLATION_ACTION_CLAIM_LEASE || 'PT5M' }}
          WEBHOOK_CORE_THREADS: ${{ vars.WEBHOOK_CORE_THREADS || '2' }}
          WEBHOOK_MAX_THREADS: ${{ vars.WEBHOOK_MAX_THREADS || '4' }}
          WEBHOOK_QUEUE_CAPACITY: ${{ vars.WEBHOOK_QUEUE_CAPACITY || '100' }}
          WEBHOOK_RECEIPT_TTL: ${{ vars.WEBHOOK_RECEIPT_TTL || 'P7D' }}
          WEBHOOK_PROCESSING_LEASE: ${{ vars.WEBHOOK_PROCESSING_LEASE || 'PT5M' }}
          WEBHOOK_REPLY_MAX_ATTEMPTS: ${{ vars.WEBHOOK_REPLY_MAX_ATTEMPTS || '3' }}
          WEBHOOK_REPLY_RETRY_BACKOFF: ${{ vars.WEBHOOK_REPLY_RETRY_BACKOFF || 'PT1S' }}
          TRANSLATION_RECORD_RETENTION: ${{ vars.TRANSLATION_RECORD_RETENTION || 'P90D' }}
          TRANSLATION_ACTION_CLAIM_RETENTION: ${{ vars.TRANSLATION_ACTION_CLAIM_RETENTION || 'P7D' }}
          AI_USAGE_EVENT_RETENTION: ${{ vars.AI_USAGE_EVENT_RETENTION || 'P730D' }}
          LINE_PUSH_FALLBACK_ENABLED: ${{ vars.LINE_PUSH_FALLBACK_ENABLED || 'true' }}
          LINE_PUSH_FALLBACK_DAILY_LIMIT: ${{ vars.LINE_PUSH_FALLBACK_DAILY_LIMIT || '100' }}
          OPEN_ROUTE_API_KEY: ${{ secrets.OPEN_ROUTE_API_KEY }}
          OPEN_ROUTE_MODEL_NAME: ${{ vars.OPEN_ROUTE_MODEL_NAME || 'openai/gpt-4o-mini' }}
          OPEN_ROUTE_API_URL: ${{ vars.OPEN_ROUTE_API_URL || 'https://openrouter.ai/api/v1' }}
          OPEN_ROUTE_HTTP_REFERER: ${{ vars.OPEN_ROUTE_HTTP_REFERER || 'https://github.com/AlienTechForge/LineBotTranslator' }}
          OPEN_ROUTE_APP_TITLE: ${{ vars.OPEN_ROUTE_APP_TITLE || 'LineBotTranslator' }}
          OPEN_ROUTE_CATALOG_TTL: ${{ vars.OPEN_ROUTE_CATALOG_TTL || 'PT15M' }}
          OPEN_ROUTE_CATALOG_WARMUP: ${{ vars.OPEN_ROUTE_CATALOG_WARMUP || 'true' }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          OCR_ENABLED: ${{ vars.OCR_ENABLED || 'true' }}
          GOOGLE_VISION_TIMEOUT_MS: ${{ vars.GOOGLE_VISION_TIMEOUT_MS || '60000' }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS }}
          ADMIN_WEB_TOKEN: ${{ secrets.ADMIN_WEB_TOKEN }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_PUBLIC_ENDPOINT: ${{ secrets.MINIO_PUBLIC_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
          MINIO_REGION: ${{ vars.MINIO_REGION || 'us-east-1' }}
          MINIO_ENABLED: ${{ vars.MINIO_ENABLED || 'true' }}
          MINIO_RETRY_INTERVAL_MS: ${{ vars.MINIO_RETRY_INTERVAL_MS || '30000' }}
          MINIO_CONNECT_TIMEOUT_MS: ${{ vars.MINIO_CONNECT_TIMEOUT_MS || '3000' }}
          MINIO_WRITE_TIMEOUT_MS: ${{ vars.MINIO_WRITE_TIMEOUT_MS || '5000' }}
          MINIO_READ_TIMEOUT_MS: ${{ vars.MINIO_READ_TIMEOUT_MS || '5000' }}
          IMAGE_TRANSLATION_MAX_FILE_SIZE_BYTES: ${{ vars.IMAGE_TRANSLATION_MAX_FILE_SIZE_BYTES || '10485760' }}
          IMAGE_TRANSLATION_MAX_DIMENSION: ${{ vars.IMAGE_TRANSLATION_MAX_DIMENSION || '4096' }}
          IMAGE_TRANSLATION_MAX_PIXELS: ${{ vars.IMAGE_TRANSLATION_MAX_PIXELS || '16000000' }}
          IMAGE_TRANSLATION_LOW_CONFIDENCE_THRESHOLD: ${{ vars.IMAGE_TRANSLATION_LOW_CONFIDENCE_THRESHOLD || '0.60' }}
          IMAGE_TRANSLATION_OVERLAY_ENABLED: ${{ vars.IMAGE_TRANSLATION_OVERLAY_ENABLED || 'true' }}
          IMAGE_TRANSLATION_MAX_REGION_AREA_RATIO: ${{ vars.IMAGE_TRANSLATION_MAX_REGION_AREA_RATIO || '0.12' }}
          IMAGE_TRANSLATION_MAX_TOTAL_MASK_RATIO: ${{ vars.IMAGE_TRANSLATION_MAX_TOTAL_MASK_RATIO || '0.35' }}
          IMAGE_TRANSLATION_MAX_OUTPUT_BYTES: ${{ vars.IMAGE_TRANSLATION_MAX_OUTPUT_BYTES || '10485760' }}
          IMAGE_TRANSLATION_DELIVERY_TARGET_BYTES: ${{ vars.IMAGE_TRANSLATION_DELIVERY_TARGET_BYTES || '2097152' }}
          IMAGE_TRANSLATION_CLEANUP_INTERVAL: ${{ vars.IMAGE_TRANSLATION_CLEANUP_INTERVAL || 'PT1H' }}
          IMAGE_PROXY_PUBLIC_BASE_URL: ${{ vars.IMAGE_PROXY_PUBLIC_BASE_URL || '' }}
          IMAGE_PROXY_TOKEN_TTL: ${{ vars.IMAGE_PROXY_TOKEN_TTL || 'PT55M' }}
          IMAGE_PROXY_MAX_ENTRIES: ${{ vars.IMAGE_PROXY_MAX_ENTRIES || '10000' }}
          IMAGE_PROXY_PREVIEW_MAX_BYTES: ${{ vars.IMAGE_PROXY_PREVIEW_MAX_BYTES || '1048576' }}
          IMAGE_PROXY_CONTENT_CACHE_TTL: ${{ vars.IMAGE_PROXY_CONTENT_CACHE_TTL || 'PT5M' }}
          IMAGE_PROXY_CONTENT_CACHE_MAX_BYTES: ${{ vars.IMAGE_PROXY_CONTENT_CACHE_MAX_BYTES || '67108864' }}
          IMAGE_TEXT_REPLY_ENABLED: ${{ vars.IMAGE_TEXT_REPLY_ENABLED || 'true' }}
          SHORT_URL_ENABLED: ${{ vars.SHORT_URL_ENABLED || 'false' }}
          DWZ_API_BASE_URL: ${{ vars.DWZ_API_BASE_URL || '' }}
          DWZ_API_TOKEN: ${{ secrets.DWZ_API_TOKEN }}
          DWZ_SHORT_DOMAIN: ${{ vars.DWZ_SHORT_DOMAIN || '' }}
          DWZ_WORKSPACE_ID: ${{ vars.DWZ_WORKSPACE_ID || '' }}
          SHORT_URL_TTL: ${{ vars.SHORT_URL_TTL || 'PT55M' }}
          LANGUAGE_DETECTION_USE_AI: ${{ vars.LANGUAGE_DETECTION_USE_AI || 'true' }}
          LANGUAGE_DETECTION_DEFAULT_CHINESE: ${{ vars.LANGUAGE_DETECTION_DEFAULT_CHINESE || 'zh-tw' }}
          APP_BROADCAST_TEST_MODE: ${{ vars.APP_BROADCAST_TEST_MODE || 'false' }}
          JAVA_TOOL_OPTIONS: ${{ vars.JAVA_TOOL_OPTIONS || '-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError' }}
        run: |
          chmod +x scripts/deploy.sh scripts/rotate-mongodb-credential.sh
          scripts/rotate-mongodb-credential.sh
