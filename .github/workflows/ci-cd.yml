name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: linebot-translator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/alientechforge/linebot-translator

jobs:
  ci:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGODB_URI: mongodb://localhost:27017/linebot_translator_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify
        run: |
          chmod +x mvnw
          ./mvnw clean verify -B

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ github.run_id }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish image and deploy
    needs: ci
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Deploy immutable image on Alien-Server
        if: github.ref == 'refs/heads/master'
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'linebot-translator' }}
          DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK || 'host' }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '4040' }}
          HOST_PORT: ${{ vars.HOST_PORT || '4040' }}
          HEALTH_TIMEOUT_SECONDS: ${{ vars.HEALTH_TIMEOUT_SECONDS || '120' }}
          LINE_BOT_CHANNEL_TOKEN: ${{ secrets.LINE_BOT_CHANNEL_TOKEN }}
          LINE_BOT_CHANNEL_SECRET: ${{ secrets.LINE_BOT_CHANNEL_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          MONGODB_CONNECT_TIMEOUT_MS: ${{ vars.MONGODB_CONNECT_TIMEOUT_MS || '3000' }}
          MONGODB_READ_TIMEOUT_MS: ${{ vars.MONGODB_READ_TIMEOUT_MS || '5000' }}
          MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${{ vars.MONGODB_SERVER_SELECTION_TIMEOUT_MS || '3000' }}
          MONGODB_HEARTBEAT_FREQUENCY_MS: ${{ vars.MONGODB_HEARTBEAT_FREQUENCY_MS || '5000' }}
          MONGODB_MIN_HEARTBEAT_FREQUENCY_MS: ${{ vars.MONGODB_MIN_HEARTBEAT_FREQUENCY_MS || '500' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_NAME: ${{ secrets.OPENAI_MODEL_NAME }}
          OPENAI_AVAILABLE_MODELS: ${{ secrets.OPENAI_AVAILABLE_MODELS }}
          OPENAI_API_URL: ${{ secrets.OPENAI_API_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_NAME: ${{ secrets.GEMINI_MODEL_NAME }}
          GEMINI_AVAILABLE_MODELS: ${{ secrets.GEMINI_AVAILABLE_MODELS }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          OCR_ENABLED: ${{ secrets.OCR_ENABLED }}
          AI_DEFAULT_PROVIDER: ${{ secrets.AI_DEFAULT_PROVIDER }}
          ADMIN_USERS: ${{ secrets.ADMIN_USERS }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
          LANGUAGE_DETECTION_USE_AI: ${{ secrets.LANGUAGE_DETECTION_USE_AI }}
          LANGUAGE_DETECTION_AI_PROVIDER: ${{ secrets.LANGUAGE_DETECTION_AI_PROVIDER }}
          LANGUAGE_DETECTION_DEFAULT_CHINESE: ${{ secrets.LANGUAGE_DETECTION_DEFAULT_CHINESE }}
          APP_BROADCAST_TEST_MODE: ${{ secrets.APP_BROADCAST_TEST_MODE }}
        run: |
          chmod +x scripts/deploy.sh
          scripts/deploy.sh
