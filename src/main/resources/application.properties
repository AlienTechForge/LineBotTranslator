# 主要配置文件 - 將使用 profile 特定的配置檔案
spring.application.name=linebot-translator

# 未指定 profile 時使用開發環境；SPRING_PROFILES_ACTIVE 仍可覆寫
spring.profiles.default=dev

# 僅公開不含詳細資訊的健康檢查，供容器與部署流程使用
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,lineConfiguration,mongo,minio,ocrConfiguration,openRouterConfiguration
management.endpoint.health.group.readiness.show-components=always
management.endpoint.health.group.readiness.show-details=never
management.endpoint.health.status.order=down,out-of-service,unknown,degraded,up,disabled
management.endpoint.health.status.http-mapping.down=503
management.endpoint.health.status.http-mapping.out-of-service=503
management.endpoint.health.status.http-mapping.degraded=200
management.endpoint.health.status.http-mapping.disabled=200

# MongoDB driver recovery is automatic; these bounds prevent startup/health checks from hanging.
mongodb.connect-timeout-ms=${MONGODB_CONNECT_TIMEOUT_MS:3000}
mongodb.read-timeout-ms=${MONGODB_READ_TIMEOUT_MS:5000}
mongodb.server-selection-timeout-ms=${MONGODB_SERVER_SELECTION_TIMEOUT_MS:3000}
mongodb.heartbeat-frequency-ms=${MONGODB_HEARTBEAT_FREQUENCY_MS:5000}
mongodb.min-heartbeat-frequency-ms=${MONGODB_MIN_HEARTBEAT_FREQUENCY_MS:500}

# MinIO is optional; failures open a circuit and an eligible request probes recovery.
minio.enabled=${MINIO_ENABLED:true}
minio.retry-interval-ms=${MINIO_RETRY_INTERVAL_MS:30000}
minio.connect-timeout-ms=${MINIO_CONNECT_TIMEOUT_MS:3000}
minio.write-timeout-ms=${MINIO_WRITE_TIMEOUT_MS:5000}
minio.read-timeout-ms=${MINIO_READ_TIMEOUT_MS:5000}

# Google Vision OCR is optional; bound each OCR call (retries included) well
# inside the webhook processing lease instead of the library's ten minutes.
google.cloud.vision.timeout-ms=${GOOGLE_VISION_TIMEOUT_MS:60000}

# Image input is validated by decoded type/dimensions before OCR. Generated
# translations use one-hour signed URLs and are removed after 24 hours.
app.image-translation.max-file-size-bytes=${IMAGE_TRANSLATION_MAX_FILE_SIZE_BYTES:10485760}
app.image-translation.max-dimension=${IMAGE_TRANSLATION_MAX_DIMENSION:4096}
app.image-translation.max-pixels=${IMAGE_TRANSLATION_MAX_PIXELS:16000000}
app.image-translation.low-confidence-threshold=${IMAGE_TRANSLATION_LOW_CONFIDENCE_THRESHOLD:0.60}
app.image-translation.overlay-enabled=${IMAGE_TRANSLATION_OVERLAY_ENABLED:true}
app.image-translation.max-region-area-ratio=${IMAGE_TRANSLATION_MAX_REGION_AREA_RATIO:0.12}
app.image-translation.max-total-mask-ratio=${IMAGE_TRANSLATION_MAX_TOTAL_MASK_RATIO:0.35}
# Total mask limit for posters and infographics (many reliable horizontal lines on flat
# backgrounds, which a flat mask does not disturb); photographs keep the limit above.
app.image-translation.poster-max-total-mask-ratio=${IMAGE_TRANSLATION_POSTER_MAX_TOTAL_MASK_RATIO:0.60}
# A page found to be turned a quarter is always brought upright from the first OCR call. With this
# on, a rotated page that was read poorly (under 80% of its text reliable) is also read a second
# time from its upright raster, at the price of one more OCR call, and the better reading is kept.
# Off until the "Page orientation decision" log shows how often retryAdvised=true occurs.
app.image-translation.orientation-retry-enabled=${IMAGE_TRANSLATION_ORIENTATION_RETRY_ENABLED:false}
# Generated images stay lossless PNG up to this size (LINE refuses originals over
# 10 MB); larger output falls back to JPEG, then downscales, else text only.
app.image-translation.max-output-bytes=${IMAGE_TRANSLATION_MAX_OUTPUT_BYTES:10485760}
# LINE fetches the original itself within its own timeout, so an opaque image whose PNG is
# above this is delivered as JPEG (quality 0.92, then 0.85) when that fits. Transparent output
# stays PNG; a value at or above max-output-bytes switches the step off.
app.image-translation.delivery-target-bytes=${IMAGE_TRANSLATION_DELIVERY_TARGET_BYTES:2097152}
app.image-translation.cleanup-interval=${IMAGE_TRANSLATION_CLEANUP_INTERVAL:PT1H}
app.image-translation.proxy-public-base-url=${IMAGE_PROXY_PUBLIC_BASE_URL:}
app.image-translation.proxy-token-ttl=${IMAGE_PROXY_TOKEN_TTL:PT55M}
app.image-translation.proxy-max-entries=${IMAGE_PROXY_MAX_ENTRIES:10000}
app.image-translation.proxy-preview-max-bytes=${IMAGE_PROXY_PREVIEW_MAX_BYTES:1048576}
app.image-translation.proxy-content-cache-ttl=${IMAGE_PROXY_CONTENT_CACHE_TTL:PT5M}
# The proxy content cache is bounded by retained bytes (original + preview PNG).
# IMAGE_PROXY_CONTENT_CACHE_ENTRIES is deprecated and ignored: Caffeine cannot
# combine an entry-count bound with a byte bound, and resolvable tokens are
# already capped by proxy-max-entries.
app.image-translation.proxy-content-cache-max-bytes=${IMAGE_PROXY_CONTENT_CACHE_MAX_BYTES:67108864}
app.image-translation.text-reply-enabled=${IMAGE_TEXT_REPLY_ENABLED:true}
app.short-url.enabled=${SHORT_URL_ENABLED:false}
app.short-url.dwz-api-base-url=${DWZ_API_BASE_URL:}
app.short-url.dwz-api-token=${DWZ_API_TOKEN:}
app.short-url.dwz-domain=${DWZ_SHORT_DOMAIN:}
app.short-url.dwz-workspace-id=${DWZ_WORKSPACE_ID:}
app.short-url.ttl=${SHORT_URL_TTL:PT55M}

# Optional operator page for browsing and deleting stored images. A blank token (the
# default) leaves the /admin/images routes unregistered; otherwise it is the bearer token.
app.admin.web.token=${ADMIN_WEB_TOKEN:}

# Load the OpenRouter model catalog once in the background after startup, so the
# first model lookup does not wait for the HTTP round trip. false keeps it lazy.
app.openrouter.catalog.warm-up=${OPEN_ROUTE_CATALOG_WARMUP:true}

# Translation cache is bounded and versioned; style ID/prompt version come from
# the allowlisted TranslationStylePreset used by each request. TTL and
# max-entries also bound the memo of AI language detections keyed by text digest.
app.translation.cache.ttl=${TRANSLATION_CACHE_TTL:PT30M}
app.translation.cache.max-entries=${TRANSLATION_CACHE_MAX_ENTRIES:1000}
app.translation.cache.glossary-version=${TRANSLATION_GLOSSARY_VERSION:none}

# A translation action claim left PROCESSING longer than this lease (crash,
# interrupted worker, failed completion write) may be taken over by one click.
app.translation.action-claim-lease=${TRANSLATION_ACTION_CLAIM_LEASE:PT5M}

# Language detection tries the AI model first and falls back to local rules. A blank
# value (for example an empty environment variable) is treated as the default.
app.language-detection.use-ai=${LANGUAGE_DETECTION_USE_AI:true}
app.language-detection.default-chinese=${LANGUAGE_DETECTION_DEFAULT_CHINESE:zh-tw}

# Broadcast test mode: when true, admin broadcasts are only simulated and nothing is pushed.
# A blank value (for example an empty environment variable) is treated as the default (off).
app.broadcast.test-mode=${APP_BROADCAST_TEST_MODE:false}

# Webhook ingestion acknowledges quickly, deduplicates by webhookEventId, and
# bounds asynchronous processing. Receipt TTL must remain longer than lease.
app.webhook.ingestion.core-threads=${WEBHOOK_CORE_THREADS:2}
app.webhook.ingestion.max-threads=${WEBHOOK_MAX_THREADS:4}
app.webhook.ingestion.queue-capacity=${WEBHOOK_QUEUE_CAPACITY:100}
app.webhook.ingestion.receipt-ttl=${WEBHOOK_RECEIPT_TTL:P7D}
app.webhook.ingestion.processing-lease=${WEBHOOK_PROCESSING_LEASE:PT5M}
app.webhook.ingestion.reply-max-attempts=${WEBHOOK_REPLY_MAX_ATTEMPTS:3}
app.webhook.ingestion.reply-retry-backoff=${WEBHOOK_REPLY_RETRY_BACKOFF:PT1S}

# MongoDB retention (ISO-8601 duration) enforced by TTL indexes. Leave blank or
# use PT0S to disable a collection; webhook receipts have their own TTL above.
app.retention.translation-records=${TRANSLATION_RECORD_RETENTION:P90D}
app.retention.translation-action-claims=${TRANSLATION_ACTION_CLAIM_RETENTION:P7D}
app.retention.ai-usage-events=${AI_USAGE_EVENT_RETENTION:P730D}

# A reply token expires after about a minute. When LINE rejects an expired token
# the answer is pushed instead. Push messages consume the Official Account's
# monthly message quota (replies are free), so they are capped per UTC+8 day.
app.line.push-fallback.enabled=${LINE_PUSH_FALLBACK_ENABLED:true}
app.line.push-fallback.daily-limit=${LINE_PUSH_FALLBACK_DAILY_LIMIT:100}

# 日誌檔案位置
logging.file.path=logs
logging.file.name=${logging.file.path}/linebot-translator.log
