# 主要配置文件 - 將使用 profile 特定的配置檔案
spring.application.name=linebot-translator

# 未指定 profile 時使用開發環境；SPRING_PROFILES_ACTIVE 仍可覆寫
spring.profiles.default=dev

# 僅公開不含詳細資訊的健康檢查，供容器與部署流程使用
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,mongo

# 日誌檔案位置
logging.file.path=logs
logging.file.name=${logging.file.path}/linebot-translator.log
