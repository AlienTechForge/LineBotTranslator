spring.main.banner-mode=off
spring.main.log-startup-info=false

line.bot.channel-token=test-channel-token
line.bot.channel-secret=test-channel-secret

mongodb.uri=${MONGODB_URI:mongodb://localhost:27018/linebot_translator_test}
mongodb.database=linebot_translator_test

openrouter.api.key=
openrouter.model.name=openai/gpt-4o-mini
app.ocr.enabled=false
app.translation.default-target-language-for-chinese=en
app.translation.default-target-language-for-others=zh-TW
GOOGLE_APPLICATION_CREDENTIALS=/tmp/nonexistent-test-credentials.json

minio.endpoint=http://localhost:9000
minio.public-endpoint=http://localhost:9000
minio.region=us-east-1
minio.access-key=test-access-key
minio.secret-key=test-secret-key
minio.bucket-name=linebot-images-test

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,lineConfiguration,mongo,minio,ocrConfiguration,openRouterConfiguration
management.endpoint.health.group.readiness.show-components=always
management.endpoint.health.group.readiness.show-details=never
