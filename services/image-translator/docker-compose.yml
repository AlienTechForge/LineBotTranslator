# image-translator, run standalone as the lab (the page is at /lab/; /v1 and /healthz are served too).
# The compose project, image and container keep the name overlay-lab on purpose: `docker compose up` from
# this directory then replaces the lab container that is already running instead of starting a second one.
#
#   cd services/image-translator
#   cp .env.example .env        # fill in the keys
#   docker compose up --build -d
#
# Vision credentials, two ways (see README.md):
#   1. DEFAULT: the production deploy already keeps the service-account JSON in the external
#      Docker volume `linebot-translator-secrets` (file /run/secrets/linebot.json, uid 10001,
#      mode 0400). It is mounted read-only below, so the secret is never copied to disk.
#      The container runs as root, which can read that 0400 file.
#   2. Host file: comment out the volume line and the top-level `volumes:` block marked
#      (1), then uncomment the block marked (2) and set in .env
#        VISION_CREDENTIALS_FILE=/path/on/host/vision.json
#        GOOGLE_APPLICATION_CREDENTIALS=/secrets/vision.json
#
# The service only needs outbound internet. It does not have to join the bot's Docker network.

name: overlay-lab

services:
  lab:
    build:
      context: .
      args:  # the LaMa model: with INPAINT_MODEL_FETCH=1 it is downloaded while the image is built (see Dockerfile); the
        # default 0 leaves it to the service, which downloads the file into ./models (mounted below) on first use, once.
        # A changed URL needs its checksum, or an empty one.
        INPAINT_MODEL_URL: "${INPAINT_MODEL_URL:-https://huggingface.co/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx}"
        INPAINT_MODEL_SHA256: "${INPAINT_MODEL_SHA256-1faef5301d78db7dda502fe59966957ec4b79dd64e16f03ed96913c7a4eb68d6}"
        INPAINT_MODEL_FETCH: "${INPAINT_MODEL_FETCH:-0}"
    image: overlay-lab:local
    container_name: overlay-lab
    restart: unless-stopped
    ports:
      - "${LAB_PORT:-4041}:${LAB_PORT:-4041}"
    environment:
      LAB_PORT: "${LAB_PORT:-4041}"
      BIND_HOST: "0.0.0.0"  # fixed: the published port needs the container to listen on every interface
      LAB_TOKEN: "${LAB_TOKEN:-}"
      SERVICE_TOKEN: "${SERVICE_TOKEN:-}"
      LAB_MOCK: "${LAB_MOCK:-0}"
      LAB_DATA_DIR: /app/data
      LAB_INK_FRACTION: "${LAB_INK_FRACTION:-0.15}"
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/linebot.json}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      CLAUDE_MODEL: "${CLAUDE_MODEL:-claude-opus-5-5}"
      CLAUDE_JUDGE_MODEL: "${CLAUDE_JUDGE_MODEL:-claude-sonnet-5-5}"
      MODE_A_RETRY: "${MODE_A_RETRY:-1}"
      # Mode C (geometric layout + text-only translation) and the eraser
      CLAUDE_TRANSLATE_MODEL: "${CLAUDE_TRANSLATE_MODEL:-}"
      MODE_C_IMAGE_CONTEXT: "${MODE_C_IMAGE_CONTEXT:-1}"
      MODE_C_CHUNK_UNITS: "${MODE_C_CHUNK_UNITS:-50}"
      ERASE_RESIDUE_CHECK: "${ERASE_RESIDUE_CHECK:-0}"  # the residue rule only measures unless this is 1
      INPAINT_MODEL: "${INPAINT_MODEL:-lama}"  # the lab opts in; telea = the OpenCV call the lab always made
      INPAINT_MODEL_PATH: "${INPAINT_MODEL_PATH:-/app/models/lama_fp32.onnx}"  # baked into the image at build time
      INPAINT_MODEL_URL: "${INPAINT_MODEL_URL:-https://huggingface.co/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx}"
      INPAINT_MODEL_SHA256: "${INPAINT_MODEL_SHA256:-}"
      # the production API (/v1): policy, budgets, retention
      OPENROUTER_MONTHLY_BUDGET_USD: "${OPENROUTER_MONTHLY_BUDGET_USD:-15}"
      ANTHROPIC_MONTHLY_BUDGET_USD: "${ANTHROPIC_MONTHLY_BUDGET_USD:-80}"
      SEND_MIN_USABILITY: "${SEND_MIN_USABILITY:-0.60}"
      V1_DEADLINE_S: "${V1_DEADLINE_S:-210}"
      V1_RETENTION_MINUTES: "${V1_RETENTION_MINUTES:-15}"
      MODE_B_MIN_REMAINING_S: "${MODE_B_MIN_REMAINING_S:-90}"
      MIN_ROTATED_COLUMN_PX: "${MIN_ROTATED_COLUMN_PX:-16}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPEN_ROUTE_API_KEY: "${OPEN_ROUTE_API_KEY:-}"
      OPENROUTER_IMAGE_MODEL: "${OPENROUTER_IMAGE_MODEL:-google/gemini-3-pro-image}"
      OPENROUTER_IMAGE_API: "${OPENROUTER_IMAGE_API:-auto}"
      # publishing the results for a reviewer (all optional; same names as the production bot)
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-}"
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-}"
      MINIO_BUCKET_NAME: "${MINIO_BUCKET_NAME:-line-bot}"
      MINIO_PREFIX: "${MINIO_PREFIX:-overlay-lab}"
      MINIO_REGION: "${MINIO_REGION:-us-east-1}"
      MINIO_URL_EXPIRY_HOURS: "${MINIO_URL_EXPIRY_HOURS:-168}"
    volumes:
      # (1) default: the production secrets volume, read-only
      - linebot-translator-secrets:/run/secrets:ro
      # (2) alternative: a credentials file on the host
      # - ${VISION_CREDENTIALS_FILE:?set VISION_CREDENTIALS_FILE}:/secrets/vision.json:ro
      # uploads and generated images (root-owned on the host); delete the folder to clean up
      - ./data:/app/data
      # the LaMa model file (INPAINT_MODEL_PATH=/app/models/lama_fp32.onnx): downloaded here on first use and kept
      # across rebuilds; when the server cannot reach Hugging Face, download it elsewhere and copy it into ./models
      - ./models:/app/models

# (1) must exist already (created by scripts/deploy.sh); delete this block for method (2)
volumes:
  linebot-translator-secrets:
    external: true
