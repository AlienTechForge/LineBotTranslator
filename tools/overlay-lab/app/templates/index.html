<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Lab</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1f23; --muted: #646a73; --line: #dcd9d0;
    --accent: #1f5fbf; --accent-ink: #ffffff; --ok: #1f7a3f; --warn: #a86400; --err: #b3261e;
    --err-bg: #fdecea; --warn-bg: #fff3dc; --ok-bg: #e6f4ea; --code: #f0eee8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1d2026; --ink: #e8e9ec; --muted: #9aa0aa; --line: #343841;
      --accent: #6aa3ff; --accent-ink: #0b1220; --ok: #5fcf8a; --warn: #f0b04a; --err: #ff8a80;
      --err-bg: #3a1c1a; --warn-bg: #3a2c12; --ok-bg: #16301f; --code: #262a31;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Noto Sans CJK TC", "Noto Sans TC", sans-serif; }
  header, main { max-width: 1480px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 20px; }
  main { padding-bottom: 40px; }
  h1 { margin: 0; font-size: 22px; }
  .sub { margin: 4px 0 16px; color: var(--muted); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px;
           background: var(--warn); color: #fff; margin-left: 8px; vertical-align: middle; }
  form, .col, details, .share { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  form { padding: 14px 16px; display: grid; gap: 12px 20px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); align-items: start; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: 13px; }
  label.check { display: flex; gap: 8px; align-items: center; font-weight: 500; font-size: 14px; }
  select, input[type=file], input[type=text], input[type=search] { width: 100%; padding: 6px; border: 1px solid var(--line); border-radius: 6px;
                              background: var(--bg); color: var(--ink); font: inherit; }
  button { padding: 9px 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
           font: inherit; font-weight: 600; cursor: pointer; }
  button.small { padding: 5px 12px; font-size: 13px; }
  button:disabled { opacity: .55; cursor: progress; }
  .hint { font-weight: 400; font-size: 12px; color: var(--muted); }
  #status { grid-column: 1 / -1; color: var(--muted); min-height: 1.5em; display: flex; gap: 8px; align-items: center; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
             border-radius: 50%; animation: spin 0.9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .models { grid-column: span 2; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0; min-width: 0; }
  @media (max-width: 640px) { .models { grid-column: auto; } }
  .models legend { font-weight: 600; font-size: 13px; padding: 0 6px; }
  #model-list { max-height: 176px; overflow: auto; margin-top: 6px; display: grid; gap: 2px; }
  .mrow { display: flex; gap: 8px; align-items: center; font-weight: 500; font-size: 13px; padding: 1px 2px; }
  .mrow.off { opacity: .5; }
  .mtag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 6px; white-space: nowrap; }
  #model-count { font-size: 12px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
  #results { margin-top: 18px; }
  .share { padding: 10px 14px; margin-bottom: 14px; display: grid; gap: 6px; }
  .share .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .share input { flex: 1 1 320px; min-width: 0; font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .scroller { overflow-x: auto; padding-bottom: 8px; }
  .grid { display: flex; gap: 14px; align-items: flex-start; }
  .col { padding: 12px; min-width: 320px; flex: 1 0 320px; max-width: 560px; }
  .col h2 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .col h2 .mname { word-break: break-all; }
  .job { margin-top: 26px; }
  .job > h2 { margin: 0 0 8px; font-size: 17px; overflow-wrap: anywhere; }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
  .pill.done { color: var(--ok); border-color: var(--ok); }
  .pill.running, .pill.pending { color: var(--warn); border-color: var(--warn); }
  .pill.error { color: var(--err); border-color: var(--err); }
  .verdict { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 1px 9px; border-radius: 99px; border: 1px solid; white-space: nowrap; }
  .v-pass { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); }
  .v-fail { color: var(--err); background: var(--err-bg); border-color: var(--err); }
  .v-fail.n2 { border-width: 2px; }
  .v-fail.n3 { border-width: 3px; }
  .v-unverified, .v-none { color: var(--muted); background: var(--code); border-color: var(--line); }
  .imgbox { position: relative; border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
            background: repeating-conic-gradient(var(--code) 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
  .imgbox img { display: block; width: 100%; height: auto; }
  .imgbox svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 10px 0 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; word-break: break-word; }
  .links { margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
  a { color: var(--accent); }
  .errbox { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: var(--err-bg); color: var(--err);
            border: 1px solid var(--err); white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  .note { margin-top: 8px; font-size: 12.5px; color: var(--warn); }
  .note ul { margin: 4px 0 0; padding-left: 18px; }
  .words { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-word; }
  details { margin-top: 14px; padding: 10px 14px; }
  .col details { margin-top: 10px; padding: 6px 10px; }
  summary { cursor: pointer; font-weight: 600; font-size: 13.5px; }
  pre { margin: 10px 0 0; padding: 10px; background: var(--code); border-radius: 6px; overflow: auto;
        max-height: 520px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
  .toggle { margin-top: 8px; font-size: 13px; }
  .seg { margin-top: 8px; font-size: 13px; }
  .seg ul { margin: 4px 0 0; padding-left: 18px; }
  .seg .src { color: var(--muted); }
  .seg .major { color: var(--err); font-weight: 600; }
  .softrun { color: var(--warn); }
  #summary { margin-bottom: 14px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .tablewrap { overflow-x: auto; max-width: 100%; }
  .summary-table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 13px; }
  .summary-table th, .summary-table td { text-align: left; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .summary-table th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  .summary-table td.num, .summary-table th.num { text-align: right; white-space: nowrap; }
  .summary-table tr.total td { font-weight: 600; border-bottom: 0; }
  .summary-table .vlist { display: flex; gap: 4px; flex-wrap: wrap; }
  @media (max-width: 640px) {  /* a phone: one block per row, so the costs are not behind a sideways scroll */
    .summary-table, .summary-table tbody, .summary-table tr, .summary-table td { display: block; }
    .summary-table thead { display: none; }
    .summary-table tr { padding: 6px 0; border-bottom: 1px solid var(--line); }
    .summary-table td { border: 0; padding: 1px 0; text-align: left !important; white-space: normal !important; }
    .summary-table td:empty { display: none; }
    .summary-table td[data-label]::before { content: attr(data-label) "　"; color: var(--muted); }
  }
  .runs-table, .units-table { border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  .runs-table th, .runs-table td, .units-table th, .units-table td { text-align: left; padding: 2px 10px 2px 0; white-space: nowrap; }
  .units-table td.txt { white-space: normal; min-width: 120px; }
  .empty { padding: 28px 8px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body data-default-model="{{ default_image_model }}" data-max-models="{{ max_models }}" data-max-batch="{{ max_batch }}">
<header>
  <h1>Overlay Lab{% if mock %}<span class="badge">LAB_MOCK=1</span>{% endif %}</h1>
  <p class="sub">圖片翻譯 overlay 的離線對照實驗：一次最多 {{ max_batch }} 張圖，每張圖各跑 Mode A（hybrid：Vision 字框 + Claude 規劃 + 乾淨擦除 + 重繪，可重試一次）與 Mode B（影像模型整張重畫，可多模型、每個模型連跑多次）；每張輸出都由 Claude 看著原圖與輸出圖審查（數字、表格列、亂碼、漏翻、可用度）。不是正式服務。</p>
</header>
<main>
  <form id="form">
    <label>圖片（1–{{ max_batch }} 張；jpg / png / webp，每張最大 {{ max_upload_mb }} MB）
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple required>
      <span class="hint">一次送出就是一個批次：每張圖一個 job、一個區塊，上方有批次彙總表。</span>
    </label>
    <label>目標語言
      <select id="lang">
        {% for code, name in languages.items() %}<option value="{{ code }}"{% if code == 'en' %} selected{% endif %}>{{ code }} — {{ name }}</option>{% endfor %}
      </select>
    </label>
    <div>
      <label class="check"><input type="checkbox" id="mode-a" checked> Mode A（hybrid，{{ claude_model }}）</label>
      <label class="check"><input type="checkbox" id="mode-a-retry"{% if mode_a_retry %} checked{% endif %}> Mode A 重試一次（帶著 judge 的發現再請 Claude 規劃一次）</label>
      <label class="check"><input type="checkbox" id="mode-b" checked> Mode B（影像模型）</label>
    </div>
    <fieldset class="models" id="models-box">
      <legend>Mode B 影像模型（最多 {{ max_models }} 個，同時平行執行）</legend>
      <input type="search" id="model-filter" placeholder="篩選模型 id…" aria-label="篩選模型 id" autocomplete="off">
      <div id="model-list" role="group" aria-label="Mode B 影像模型"></div>
      <div id="model-count"></div>
    </fieldset>
    <label>輸出尺寸
      <select id="size">
        <option value="default">預設（不送，用供應商的尺寸）</option>
        {% for s in output_sizes %}<option value="{{ s }}"{% if s == default_output_size %} selected{% endif %}>{{ s }}</option>{% endfor %}
      </select>
      <span class="hint">送出 OpenRouter Image API 文件上的 <code>resolution</code> 參數，只對 images 路徑生效；chat 路徑沒有文件化的尺寸參數，會顯示「未套用」。</span>
    </label>
    <label>每個模型連跑 N 次
      <select id="runs">
        {% for n in range(1, max_runs + 1) %}<option value="{{ n }}"{% if n == 1 %} selected{% endif %}>{{ n }}</option>{% endfor %}
      </select>
      <span class="hint">每次都是獨立的一輪（各自的重試、驗證與 judge），每輪一欄，並算出各模型的通過率。同時最多 {{ max_generations }} 個生成在跑、最多 {{ max_claude }} 個 Claude 呼叫在跑（規劃與 judge 共用），其餘排隊；429 會等 20 秒再試一次。費用大約是 N 倍。</span>
    </label>
    <label class="check"><input type="checkbox" id="judge" checked> 視覺審查（Claude judge：{{ judge_model }}，每次嘗試一次呼叫；沒開就沒有判定）</label>
    <label class="check"><input type="checkbox" id="details"> 顯示驗證細節（展開面板，並附上輸出圖的 OCR 全文）</label>
    <button type="submit" id="submit">開始</button>
    <div id="status" role="status"></div>
  </form>

  <section id="results" hidden>
    <div id="summary" hidden></div>
    <div class="share" id="batch-share"></div>
    <div id="jobs"></div>
  </section>
</main>

<script>
(() => {
  const TOKEN = new URLSearchParams(location.search).get('token') || '';
  const H = TOKEN ? { 'X-Lab-Token': TOKEN } : {};
  const url = (u) => TOKEN ? u + (u.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN) : u;
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) { if (k === 'class') n.className = v; else n.setAttribute(k, v); }
    for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(String(k)));
    return n;
  };
  const SVGNS = 'http://www.w3.org/2000/svg';
  const DEFAULT_MODEL = document.body.dataset.defaultModel;
  const MAX_MODELS = parseInt(document.body.dataset.maxModels, 10) || 4;
  const MAX_BATCH = parseInt(document.body.dataset.maxBatch, 10) || 4;
  const fmtMs = (ms) => ms == null ? '—' : (ms >= 1000 ? (ms / 1000).toFixed(1) + ' s' : ms + ' ms');
  const fmtUsd = (v) => v == null ? '—' : '$' + (v < 0.01 ? v.toFixed(5) : v.toFixed(4));
  const fmtScore = (v) => v == null ? '—' : (Math.floor(v * 100) / 100).toFixed(2);  // 0.996 shows as 0.99, never as a rounded-up 1.00
  let timer = null, startedAt = 0;

  // ------------------------------------------------------------ model picker (up to MAX_MODELS)
  const picker = { all: [], details: {}, selected: [DEFAULT_MODEL] };

  function renderPicker() {
    const filter = $('model-filter').value.trim().toLowerCase();
    const list = $('model-list');
    list.replaceChildren();
    const full = picker.selected.length >= MAX_MODELS;
    const order = [...picker.selected, ...picker.all.filter((id) => !picker.selected.includes(id))];
    for (const id of order) {
      const on = picker.selected.includes(id);
      if (!on && filter && !id.toLowerCase().includes(filter)) continue;
      const d = picker.details[id] || {};
      const cb = el('input', { type: 'checkbox', value: id });
      cb.checked = on;
      cb.disabled = !on && full;
      cb.addEventListener('change', () => {
        picker.selected = cb.checked ? [...picker.selected, id] : picker.selected.filter((x) => x !== id);
        renderPicker();
      });
      const row = el('label', { class: 'mrow' + (cb.disabled ? ' off' : '') }, cb, el('span', {}, id));
      if (d.preferred_route === 'images') row.append(el('span', { class: 'mtag', title: '先走 /api/v1/images，失敗再走 chat' }, 'images 優先'));
      if (d.input_image === false) row.append(el('span', { class: 'mtag' }, '僅文字輸入'));
      list.append(row);
    }
    $('model-count').textContent = '已選 ' + picker.selected.length + ' / ' + MAX_MODELS + (picker.selected.length ? '：' + picker.selected.join('、') : '');
  }

  async function loadModels() {
    renderPicker();
    try {
      const r = await fetch(url('api/image-models'), { headers: H });
      const data = await r.json();
      picker.all = data.models || [];
      picker.details = data.details || {};
      if (data.default && !picker.selected.length) picker.selected = [data.default];
      renderPicker();
      if (data.error) $('status').textContent = '模型清單載入失敗，只列出預設模型：' + data.error;
    } catch (e) { /* the default model from the page stays */ }
  }
  $('model-filter').addEventListener('input', renderPicker);

  // ------------------------------------------------------------ small DOM helpers
  function row(dl, k, v) { if (v === undefined || v === null || v === '') return; dl.append(el('dt', {}, k), el('dd', {}, v)); }
  function pill(status) { return el('span', { class: 'pill ' + status }, { pending: '等待', running: '執行中', done: '完成', error: '失敗', skipped: '未執行' }[status] || status); }
  // appended only when there is a message (DOM append(null) would print the word "null")
  function addErr(parent, msg) { if (msg) parent.append(el('div', { class: 'errbox' }, msg)); }
  function dlLink(job, name, label) { return el('a', { href: url('files/' + job.job_id + '/' + name + '?dl=1') }, label); }
  function imgBox(src) { const img = el('img', { src: url(src), alt: '' }); return el('div', { class: 'imgbox' }, img); }

  // ------------------------------------------------------------ verdicts
  const CHECK_TEXT = {
    numbers: 'numbers：judge 看到價格、日期、時間、電話或數量被改',
    rows: 'rows：表格／清單的列重複、漏掉，或手寫標記錯位到別的項目旁',
    garbled: 'garbled：有重要的字是亂碼、讀不出來或被遮住',
    partial: 'partial：有重要的字（標題、整欄內文）還是來源語言',
    score: 'score：可用度低於門檻',
  };
  function verdictTip(verdict) {
    if (verdict === 'pass') return '五項檢查都過：數字、表格列、文字清晰度、完整翻譯、可用度';
    if (verdict === 'unverified') return 'judge 沒有給出判定（沒開、沒有金鑰、API 錯誤或沒有輸出圖）；圖照常顯示，不會重試';
    return verdict.split('+').map((c) => CHECK_TEXT[c] || c).join('\n');
  }
  // the verdict, plus the judge's usability when there is one (e.g. "pass · 0.97")
  function verdictBadge(verdict, pending, usability) {
    if (!verdict) return el('span', { class: 'verdict v-none', title: pending ? '審查進行中' : '沒有審查' }, pending ? '審查中…' : '未審查');
    const n = verdict === 'pass' || verdict === 'unverified' ? 0 : verdict.split('+').length;
    const cls = verdict === 'pass' ? 'v-pass' : verdict === 'unverified' ? 'v-unverified' : 'v-fail n' + Math.min(n, 3);
    const score = typeof usability === 'number' ? ' · ' + fmtScore(usability) : '';
    return el('span', { class: 'verdict ' + cls, title: verdictTip(verdict) + (score ? '\n可用度 ' + fmtScore(usability) : '') }, verdict + score);
  }
  const usabilityOf = (t) => (t && t.verification && typeof t.verification.usability === 'number') ? t.verification.usability : null;

  // ------------------------------------------------------------ the verification panel of one attempt
  const SEG_STRUCT = { duplicated_row: '列重複', missing_row: '列漏掉', shifted: '位置移動', misaligned_marks: '標記錯位', other: '其他' };
  const WARN_TEXT = {
    'digits-missing': '來源的（高信心）數字在輸出 OCR 裡找不到',
    'digits-unverified': '低信心（手寫）的數字在輸出 OCR 裡找不到，請用肉眼確認',
    'leftover-ratio': '輸出 OCR 裡來源語言的字比例超過門檻',
    'leftover-big-glyph': '輸出 OCR 裡有一個很大的字還是來源語言',
  };

  function ocrWarningsPanel(v) {
    const w = v.ocr_warnings || {};
    const codes = w.warnings || [];
    const d = el('details', { class: 'ocrwarn' });
    d.append(el('summary', {}, 'OCR 警告（' + (w.status === 'ok' ? codes.length : '沒有') + '；只提醒，不影響判定）'));
    if (w.status !== 'ok') { d.append(el('div', { class: 'note' }, 'Vision 沒跑成功：' + (w.error || '沒有 OCR 結果') + '——沒有 OCR 警告可看，判定不受影響。')); return d; }
    d.append(el('div', { class: 'hint' }, 'Vision 會把很小的字、手寫字讀錯，所以這些檢查只當提示：判定只看 judge 看圖的結果。'));
    if (codes.length) d.append(el('ul', { class: 'note' }, codes.map((c) => el('li', {}, WARN_TEXT[c] || c))));
    else d.append(el('div', { class: 'hint' }, 'OCR 沒有發現問題。'));
    const dl = el('dl');
    row(dl, '來源語言', (w.source_language || '（無法判斷）') + (w.source_language_method ? '（' + (w.source_language_method === 'detected' ? 'Vision 偵測' : '文字 script 推斷') + '）' : '') + ' → ' + v.target_language);
    const soft = w.soft_digit_runs || 0;
    row(dl, '數字', w.digits_ok ? `沒有遺失（來源有 ${w.source_digit_runs} 組 2 位以上的數字${soft ? `，其中 ${soft} 組是低信心的手寫／小字` : ''}）` : `找不到 ${(w.missing_digit_runs || []).length} 組 / 共 ${w.source_digit_runs} 組`);
    if (!w.digits_ok) row(dl, '缺少的數字', el('span', { class: 'words' }, (w.missing_digit_details || []).map((m) => m.as_written).join('、') || (w.missing_digit_runs || []).join('、')));
    if (w.unverified_digit_runs && w.unverified_digit_runs.length) {
      row(dl, '無法確認的數字', el('span', { class: 'words softrun' }, '⚠ ' + (w.unverified_digit_details || []).map((m) => `${m.as_written}（信心 ${m.confidence}）`).join('、')));
    }
    row(dl, '殘留比例', `${(w.leftover_ratio * 100).toFixed(1)}%（門檻 ${(v.thresholds.leftover_ratio_max * 100).toFixed(0)}%；${w.leftover_count} / ${w.source_language_words} 個來源語言的字）`);
    if (w.leftover_words && w.leftover_words.length) row(dl, '殘留的字', el('span', { class: 'words' }, w.leftover_words.join('、')));
    if (w.big_leftover_words && w.big_leftover_words.length) {
      row(dl, '大字沒翻', el('span', { class: 'words' }, w.big_leftover_words.map((b) => `「${b.word}」高 ${b.height}px，是輸出字高中位數 ${b.median_height}px 的 ${b.ratio} 倍`).join('；')));
    }
    d.append(dl);
    if (w.digit_runs && w.digit_runs.length) {
      const statusText = { ok: '找到', near: '找到（差 1 位）', unverified: '沒找到（低信心，只提醒）', missing: '沒找到' };
      const table = el('table', { class: 'runs-table' }, el('thead', {}, el('tr', {}, ['數字', 'OCR 信心', '類型', '結果'].map((h) => el('th', {}, h)))),
        el('tbody', {}, w.digit_runs.map((r) => el('tr', {}, el('td', {}, r.as_written), el('td', {}, String(r.confidence)), el('td', {}, r.soft ? '軟（< ' + v.thresholds.soft_confidence_max + '）' : '硬'),
          el('td', {}, (statusText[r.status] || r.status) + (r.matched ? '：' + r.matched : ''))))));
      d.append(el('details', {}, el('summary', {}, '數字明細（' + w.digit_runs.length + ' 組）'), table));
    }
    if (w.output_text != null) d.append(el('details', {}, el('summary', {}, '輸出圖的 OCR 全文'), el('pre', {}, w.output_text || '（沒有辨識到文字）')));
    return d;
  }

  function verificationPanel(job, b, t, open) {
    const v = t.verification;
    const d = el('details', { class: 'vdetail' });
    if (open) d.open = true;
    d.append(el('summary', {}, '驗證細節'));
    if (!v) {
      d.append(el('div', { class: 'note' }, t.verify_error ? '驗證沒跑成功：' + t.verify_error : (b.status === 'running' ? '驗證進行中…' : '沒有驗證結果')));
      return d;
    }
    const j = v.judge;
    const dl = el('dl');
    row(dl, '判定', verdictBadge(v.verdict, false, v.usability));
    if (v.checks) {
      const c = v.checks;
      const mark = (ok) => ok ? '過' : '沒過';
      row(dl, 'numbers', `${mark(c.numbers.ok)}（${c.numbers.count} 個被改的數字）`);
      row(dl, 'rows', `${mark(c.rows.ok)}（${c.rows.count} 個列問題）`);
      row(dl, 'garbled', `${mark(c.garbled.ok)}（${c.garbled.count} 處重要的文字讀不出來）`);
      row(dl, 'partial', `${mark(c.partial.ok)}（${c.partial.count} 處重要的文字沒翻）`);
      row(dl, 'score', `${mark(c.score.ok)}（可用度 ${fmtScore(c.score.usability)}，門檻 ${fmtScore(c.score.min)}）`);
      row(dl, '完成度 coverage', fmtScore(v.coverage) + '（只顯示，不影響判定，用來比較）');
    }
    if (j && j.status === 'ok') {
      row(dl, 'judge', `${j.served_model || j.model}　${fmtMs(j.elapsed_ms)}　${j.cost_usd == null ? '（未知模型，只有 tokens）' : fmtUsd(j.cost_usd)}　${j.input_tokens} / ${j.output_tokens} tokens`);
      row(dl, 'judge 摘要', j.summary);
    } else if (j) {
      row(dl, '視覺審查', el('span', { class: 'softrun' }, 'judge: ' + (j.status === 'skipped' ? 'skipped（' + (j.note || '') + '）' : 'unavailable' + (j.error ? '：' + j.error : '')) + '——沒有判定（unverified）'));
    } else {
      row(dl, '視覺審查', '沒有開（沒有判定）');
    }
    row(dl, '驗證耗時', fmtMs(t.verify_ms));
    d.append(dl);
    if (v.note) d.append(el('div', { class: 'note' }, v.note));
    if (j && j.status === 'ok') {
      const seg = (title, items, fmt) => (items && items.length)
        ? el('div', { class: 'seg' }, el('strong', {}, title + '（' + items.length + '）'), el('ul', {}, items.map((x) => el('li', {}, fmt(x))))) : null;
      const majorTag = (x) => x.major ? el('span', { class: 'major' }, '［重要］') : el('span', { class: 'src' }, '［次要］');
      const lists = [
        seg('文字亂碼／讀不出來', j.legibility_issues, (x) => [majorTag(x), el('span', {}, ' ' + (x.where || '') + (x.output_text ? '：「' + x.output_text + '」' : '')), x.problem ? el('span', { class: 'src' }, '　' + x.problem) : null]),
        seg('表格／清單的結構問題', j.structure_issues, (x) => [el('span', { class: ['duplicated_row', 'missing_row', 'misaligned_marks'].includes(x.type) ? 'major' : 'src' }, '［' + (SEG_STRUCT[x.type] || x.type) + '］'), el('span', {}, ' ' + x.detail)]),
        seg('數字被改', j.altered_numbers, (x) => `原圖 ${x.source} → 輸出 ${x.output}${x.where ? '（' + x.where + '）' : ''}`),
        seg('沒翻（仍是來源語言）', j.untranslated, (x) => [majorTag(x), el('span', {}, ' 「' + x.text + '」' + (x.where ? '（' + x.where + '）' : ''))]),
        seg('翻錯（意思不同，不影響判定）', j.mistranslated, (x) => [el('span', {}, '「' + x.output_text + '」'), x.source_text ? el('span', { class: 'src' }, ' ← 原文「' + x.source_text + '」') : null, x.problem ? el('span', { class: 'src' }, '　' + x.problem) : null]),
      ].filter(Boolean);  // append(null) would print the word "null"
      lists.forEach((n) => d.append(n));
      if (!lists.length) d.append(el('div', { class: 'hint' }, 'judge 沒有列出任何問題。'));
    }
    d.append(ocrWarningsPanel(v));
    if (t.verification_file) d.append(el('div', { class: 'links' }, dlLink(job, t.verification_file, '下載驗證 JSON')));
    return d;
  }

  // ------------------------------------------------------------ columns
  function renderOriginal(job, c, ctx) {
    c.replaceChildren();
    c.append(el('h2', {}, '原圖'));
    const box = imgBox(job.image.url);
    c.append(box);
    const a = job.mode_a;
    if (a && a.units && a.units.length) {
      const svg = document.createElementNS(SVGNS, 'svg');
      const [pw, ph] = a.page || [job.image.width, job.image.height];
      svg.setAttribute('viewBox', `0 0 ${pw} ${ph}`);
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.style.display = ctx.showFrames ? '' : 'none';
      const colors = { translated: '#1f6fe0', kept: '#1f9a50', skipped: '#999' };
      for (const u of a.units) {
        const poly = document.createElementNS(SVGNS, 'polygon');
        poly.setAttribute('points', u.frame.map((p) => p.join(',')).join(' '));
        poly.setAttribute('fill', 'none');
        poly.setAttribute('stroke', colors[u.action] || '#999');
        poly.setAttribute('stroke-width', Math.max(2, pw / 400));
        svg.append(poly);
        const t = document.createElementNS(SVGNS, 'text');
        t.setAttribute('x', u.frame[0][0]); t.setAttribute('y', u.frame[0][1]);
        t.setAttribute('font-size', Math.max(10, pw / 60)); t.setAttribute('fill', colors[u.action] || '#999');
        t.textContent = u.id;
        svg.append(t);
      }
      box.append(svg);
      const cb = el('input', { type: 'checkbox' });
      cb.checked = ctx.showFrames;
      cb.addEventListener('change', () => { ctx.showFrames = cb.checked; svg.style.display = ctx.showFrames ? '' : 'none'; });
      c.append(el('label', { class: 'check toggle' }, cb, '疊上 Mode A 的 unit 框（藍：翻譯／綠：保留／灰：略過）'));
    }
    const dl = el('dl'); row(dl, '尺寸', job.image.width + ' × ' + job.image.height + ' px'); row(dl, '目標語言', job.params.target_lang);
    c.append(dl);
  }

  function unitsTable(units) {
    const head = ['id', '動作', '角色', '重要性', '擦除', '用字', '字級（比例）', '長出'].map((h) => el('th', {}, h));
    const body = units.map((u) => {
      const action = u.action === 'skipped' ? 'skipped: ' + (u.skip_reason || '') : u.action;
      return el('tr', {},
        el('td', {}, u.id), el('td', {}, action), el('td', {}, u.role), el('td', {}, u.importance || ''),
        el('td', {}, u.erase_method || '—'), el('td', {}, u.text_used || '—'),
        el('td', {}, u.font_size ? u.font_size + ' px（' + (u.fit_ratio != null ? u.fit_ratio : '—') + (u.readable === false ? '，低於可讀門檻' : '') + '）' : '—'),
        el('td', {}, u.grow && (u.grow[0] || u.grow[1]) ? u.grow.join(' / ') + ' px' : '—'));
    });
    return el('table', { class: 'units-table' }, el('thead', {}, el('tr', {}, head)), el('tbody', {}, body));
  }

  function countBy(units, key, value) { return units.filter((u) => u[key] === value).length; }

  function aAttemptBlock(job, a, t) {
    const d = el('details', { class: 'attempt' });
    d.append(el('summary', {}, `嘗試 ${t.n}（${t.selected ? '採用' : '未採用'}）　`, verdictBadge(t.verdict, false, usabilityOf(t)), `　${fmtMs(t.elapsed_ms)}　${fmtUsd(t.cost_usd)}`));
    d.append(imgBox('files/' + job.job_id + '/' + t.output));
    if (t.retry_feedback) d.append(el('details', {}, el('summary', {}, '這次多送給 Claude 的段落（judge 的發現）'), el('pre', {}, t.retry_feedback)));
    d.append(verificationPanel(job, { status: a.status }, t, false));
    d.append(el('div', { class: 'links' }, dlLink(job, t.output, '下載 PNG'), t.units_file ? dlLink(job, t.units_file, '下載 units JSON') : null));
    return d;
  }

  function renderA(job, c) {
    c.replaceChildren();
    const a = job.mode_a;
    const attempts = a.attempts || [];
    const main = attempts.find((t) => t.selected) || attempts[0];
    c.append(el('h2', {}, 'Mode A', pill(a.status), a.status === 'done' ? verdictBadge(a.verdict, false, a.usability) : null));
    if (a.output) c.append(imgBox('files/' + job.job_id + '/' + a.output));
    else if (a.status !== 'error') c.append(el('div', { class: 'empty' }, '處理中…'));
    if (a.status === 'done') {
      const units = a.units || [];
      const dl = el('dl');
      row(dl, '總耗時', fmtMs(a.elapsed_ms) + (attempts.length > 1 ? '（含重試）' : ''));
      row(dl, 'Vision', fmtMs(a.vision_ms));
      row(dl, 'Claude 規劃', fmtMs(a.claude_ms));
      row(dl, 'erase / render', fmtMs(a.erase_ms) + ' / ' + fmtMs(a.render_ms));
      row(dl, '審查耗時', fmtMs(a.verify_ms));
      row(dl, 'tokens (in / out)', a.tokens.input + ' / ' + a.tokens.output + (attempts.length > 1 ? '（兩次規劃合計）' : ''));
      row(dl, '費用（Anthropic 額度）', a.total_cost_usd == null ? '（未知模型，只顯示 tokens）' : fmtUsd(a.total_cost_usd) + '（規劃 ' + fmtUsd(a.cost_usd) + ' + judge ' + fmtUsd(a.judge_cost_usd) + '）');
      row(dl, 'units', `${a.translated_count} 翻譯 / ${a.unit_count} 共 / ${a.word_count} 字`);
      row(dl, '擦除方法', `flat ${countBy(units, 'erase_method', 'flat')} 個 / inpaint ${countBy(units, 'erase_method', 'inpaint')} 個`);
      row(dl, '用 short 的 unit', countBy(units, 'text_used', 'short') + ' 個');
      const tooSmall = units.filter((u) => u.skip_reason === 'too small').length;
      if (tooSmall) row(dl, '太小而略過', tooSmall + ' 個次要 unit（保持原樣）');
      row(dl, '模型', a.served_model && a.served_model !== a.model ? `${a.model}（實際：${a.served_model}）` : a.model);
      row(dl, 'fallback 形式', a.fallback_form);
      if (attempts.length > 1) row(dl, '自動重試', `嘗試 1 是 ${attempts[0].verdict || '—'}，已重試；採用嘗試 ${a.selected_attempt}`);
      c.append(dl);
      c.append(el('div', { class: 'links' }, dlLink(job, a.output, '下載 PNG'), dlLink(job, a.erased, '下載僅擦除版'), a.units_file ? dlLink(job, a.units_file, '下載 units JSON') : null));
      if (a.warnings && a.warnings.length) c.append(el('div', { class: 'note' }, '提醒', el('ul', {}, a.warnings.map((w) => el('li', {}, w)))));
      const over = units.filter((u) => u.overflowed).length;
      if (over) c.append(el('div', { class: 'note' }, over + ' 個 unit 超出框（見 units 表的字級與 JSON 面板的 overflowed）'));
      if (main) c.append(verificationPanel(job, a, main, job.params.verify_details));
      if (units.length) c.append(el('details', {}, el('summary', {}, 'Mode A 每個 unit（擦除方法、用字、字級）'), unitsTable(units)));
      for (const t of attempts) if (!t.selected) c.append(aAttemptBlock(job, a, t));
    }
    addErr(c, a.error);
    addErr(c, a.retry_error ? 'Mode A 自動重試失敗（沿用嘗試 1）：' + a.retry_error : null);
  }

  function sizeNote(b, t) {
    if (!b.resolution_requested) return '預設';
    if (t.resolution_applied) return b.resolution_requested + '（已套用，images 路徑 resolution）';
    if ((t.api_used || '').startsWith('chat')) return b.resolution_requested + '（未套用：chat 路徑沒有文件化的尺寸參數）';
    if ((t.api_used || '').includes('no resolution')) return b.resolution_requested + '（未套用：供應商拒絕 resolution，已略過）';
    return b.resolution_requested + '（未套用）';
  }

  function tryBlock(job, b, t) {
    const d = el('details', { class: 'attempt' });
    d.append(el('summary', {}, `嘗試 ${t.n}（${t.selected ? '採用' : '未採用'}）　`, verdictBadge(t.verdict, b.status === 'running', usabilityOf(t)), `　${fmtMs((t.elapsed_ms || 0) + (t.verify_ms || 0))}　${fmtUsd(t.cost_usd)}`));
    d.append(imgBox('files/' + job.job_id + '/' + t.output));
    const dl = el('dl');
    row(dl, 'API 路徑', t.api_used);

    row(dl, '生成耗時', fmtMs(t.elapsed_ms));
    d.append(dl);
    if (t.n > 1 && t.prompt) d.append(el('details', {}, el('summary', {}, '這次送出的 prompt'), el('pre', {}, t.prompt)));
    d.append(verificationPanel(job, b, t, false));
    d.append(el('div', { class: 'links' }, dlLink(job, t.output, '下載 PNG')));

  function renderB(job, i, c) {
    const b = job.mode_b.results[i];
    c.replaceChildren();
    const tries = b.tries || [];
    const main = tries.find((t) => t.selected) || tries[0];
    const checking = b.status === 'running' && b.verify;
    const runTag = (b.runs || 1) > 1 ? ' · run ' + b.run : '';
    c.append(el('h2', {}, el('span', { class: 'mname' }, 'Mode B · ' + b.model + runTag), pill(b.status), main || b.status === 'running' ? verdictBadge(b.verdict, checking, usabilityOf(main)) : null));
    if (b.output) c.append(imgBox('files/' + job.job_id + '/' + b.output));
    else if (b.status !== 'error') c.append(el('div', { class: 'empty' }, '處理中…'));
    if (b.output && main) {
      const dl = el('dl');
      row(dl, '耗時（含驗證與重試）', fmtMs(b.elapsed_ms) + (tries.length > 1 ? `（生成 ${fmtMs(b.generation_ms)} + 驗證 ${fmtMs(b.verify_ms)}）` : ''));
      row(dl, 'API 路徑', b.api_used + '　（優先：' + b.route_preference + '）');
      const u = b.usage || {};
      if (u.prompt_tokens != null || u.completion_tokens != null) row(dl, 'tokens (in / out)', (u.prompt_tokens ?? '—') + ' / ' + (u.completion_tokens ?? '—') + (tries.length > 1 ? '（兩次合計）' : ''));
      row(dl, '費用（OpenRouter 現金，生成）', b.cost_usd == null ? '（回應沒有帶 cost）' : fmtUsd(b.cost_usd) + (tries.length > 1 ? '（兩次合計：' + tries.map((t) => fmtUsd(t.cost_usd)).join(' + ') + '）' : ''));
      if (b.judge) row(dl, '費用（Anthropic 額度，judge）', b.judge_cost_usd == null ? '（沒有，judge 不可用或未知模型）' : fmtUsd(b.judge_cost_usd) + (tries.length > 1 ? '（' + tries.map((t) => fmtUsd(t.judge_cost_usd)).join(' + ') + '）' : ''));
      row(dl, '費用（合計）', fmtUsd(b.total_cost_usd));
      row(dl, '輸出尺寸', b.output_size.join(' × ') + ' px（長寬比差 ' + b.aspect_drift_pct + '%）');
      row(dl, '尺寸選項', sizeNote(b, main));
      if (tries.length > 1) row(dl, '自動重試', `嘗試 1 是 ${tries[0].verdict || '—'}，已重試；採用嘗試 ${b.selected_attempt}`);
      c.append(dl);
      c.append(el('div', { class: 'links' }, dlLink(job, b.output, '下載 PNG')));
      if (b.verify) c.append(verificationPanel(job, b, main, job.params.verify_details));
      if (b.model_text) c.append(el('div', { class: 'note' }, '模型附帶文字：' + b.model_text));
      if (b.route_errors && b.route_errors.length) c.append(el('div', { class: 'note' }, '先前的嘗試', el('ul', {}, b.route_errors.map((w) => el('li', {}, w)))));
      for (const t of tries) if (!t.selected) c.append(tryBlock(job, b, t));  // the other attempt, collapsed
    }
    addErr(c, b.error);
    addErr(c, b.retry_error ? '自動重試失敗（沿用嘗試 1）：' + b.retry_error : null);
    addErr(c, b.verify_error ? '驗證失敗：' + b.verify_error : null);
  }

  // ------------------------------------------------------------ the batch summary (one row per image x mode / model)
  function renderSummary(batch) {
    const box = $('summary'); box.replaceChildren();
    const rows = batch.summary || [];
    if (!rows.length) { box.hidden = true; return; }
    box.hidden = false;
    box.append(el('strong', {}, '批次彙總（' + batch.job_ids.length + ' 張圖；每張圖 × Mode / 模型一列）'));
    const nameOf = (r) => '圖片 ' + r.image_index + (r.image_name ? ' · ' + r.image_name : '');
    const head = [['圖片', ''], ['Mode / 模型', ''], ['判定', ''], ['可用度', 'num'], ['Anthropic（額度）', 'num'], ['OpenRouter（現金）', 'num'], ['時間', 'num']];
    const table = el('table', { class: 'summary-table' });
    table.append(el('thead', {}, el('tr', {}, head.map(([h, cls]) => el('th', { class: cls }, h)))));
    const body = el('tbody');
    let last = null;
    for (const r of rows) {
      const first = r.image_index !== last; last = r.image_index;
      const live = ['pending', 'running'].includes(r.status);
      const verdict = live ? pill(r.status) : r.status === 'error' ? pill('error') : verdictBadge(r.verdict, false, null);
      const runs = r.runs > 1 && !live ? el('span', { class: 'hint' }, `　${r.passes} / ${r.runs_done + r.runs_failed} 次 pass（最佳 run）`) : null;
      body.append(el('tr', {},
        el('td', {}, first ? el('a', { href: '#job-' + r.image_index }, nameOf(r)) : null),
        el('td', {}, el('span', { class: 'mname' }, r.label)),
        el('td', {}, verdict, runs),
        el('td', { class: 'num', 'data-label': '可用度' }, r.status === 'done' ? fmtScore(r.usability) : '—'),
        el('td', { class: 'num', 'data-label': 'Anthropic（額度）' }, fmtUsd(r.cost_anthropic_usd)),
        el('td', { class: 'num', 'data-label': 'OpenRouter（現金）' }, r.mode === 'A' ? '—' : fmtUsd(r.cost_openrouter_usd)),
        el('td', { class: 'num', 'data-label': '時間' }, fmtMs(r.elapsed_ms))));
    }
    const t = batch.totals || {};
    body.append(el('tr', { class: 'total' }, el('td', {}, '合計'), el('td', {}, `${t.rows_passed || 0} / ${t.rows || 0} 列 pass`), el('td', {}), el('td', {}),
      el('td', { class: 'num', 'data-label': 'Anthropic（額度）' }, fmtUsd(t.cost_anthropic_usd)), el('td', { class: 'num', 'data-label': 'OpenRouter（現金）' }, fmtUsd(t.cost_openrouter_usd)), el('td', {})));
    table.append(body);
    box.append(el('div', { class: 'tablewrap' }, table));  // scrolls inside the box on a phone, never the page
    box.append(el('div', { class: 'hint' }, '判定與可用度是該列最佳一次的結果（Mode B 連跑多次時取 verify.choose_attempt 排出的最佳 run）；Anthropic 是 Claude 的費用（Mode A 的規劃與所有 judge，由訂閱額度支付），OpenRouter 是影像模型的現金費用（含重試）；時間是每次嘗試的平均。費用只算已完成的 run，且是依價目表的估計。'));
  }

  // ------------------------------------------------------------ the reviewer links
  function copyText(text, button) {
    const done = () => { const old = button.textContent; button.textContent = '已複製'; setTimeout(() => { button.textContent = old; }, 1500); };
    const fallback = () => {
      const t = el('textarea', { style: 'position:fixed;opacity:0' }); t.value = text; document.body.append(t); t.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* the field stays selectable */ } t.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }

  function linkRow(manifestUrl, label) {
    const input = el('input', { type: 'text', readonly: 'readonly', value: manifestUrl, 'aria-label': label });
    const btn = el('button', { type: 'button', class: 'small' }, '複製');
    btn.addEventListener('click', () => copyText(manifestUrl, btn));
    input.addEventListener('focus', () => input.select());
    return el('div', { class: 'row' }, input, btn);
  }

  function renderBatchShare(batch) {
    const s = $('batch-share'); s.replaceChildren();
    const p = batch.publish || { status: 'pending' };
    s.append(el('strong', {}, '批次 manifest（給審閱者的連結）'));
    if (p.status === 'pending' || p.status === 'running') {
      s.append(el('div', { class: 'row' }, batch.status === 'done' ? el('span', { class: 'spinner' }) : null, '等每張圖都跑完、上傳完，才會上傳批次 manifest'));
    } else if (p.status === 'done') {
      s.append(linkRow(p.manifest_url, '批次 manifest 連結'));
      s.append(el('div', { class: 'hint' }, `這是批次 manifest.json 的連結，裡面有每張圖的 manifest 連結與上面的彙總列；${p.expiry_hours} 小時內有效（到 ${p.expires_at}），連到 ${p.jobs_linked} 個 job manifest。` + (p.note ? ' ' + p.note : '')));
      s.append(el('div', { class: 'links' }, el('a', { href: url('api/batches/' + batch.batch_id + '/manifest') }, '本機 manifest.json')));
    } else if (p.status === 'skipped') {
      s.append(el('div', { class: 'note' }, p.note || '未發佈'));
    } else {
      s.append(el('div', { class: 'errbox' }, p.error || '發佈失敗'));
    }
    if (batch.warnings && batch.warnings.length) s.append(el('div', { class: 'note' }, '提醒', el('ul', {}, batch.warnings.map((w) => el('li', {}, w)))));
  }

  function renderShare(job, s) {
    s.replaceChildren();
    const p = job.publish || { status: 'pending' };
    s.append(el('strong', {}, '這張圖的 manifest（給審閱者的連結）'));
    if (p.status === 'pending' || p.status === 'running') {
      s.append(el('div', { class: 'row' }, job.status === 'done' ? el('span', { class: 'spinner' }) : null, job.status === 'done' ? '上傳到 MinIO 中…' : '等所有模型跑完之後上傳'));
    } else if (p.status === 'done') {
      s.append(linkRow(p.manifest_url, '給審閱者的連結'));
      s.append(el('div', { class: 'hint' }, `這是這個 job 的 manifest.json 的連結，裡面有這張圖所有圖片與 JSON 的連結；${p.expiry_hours} 小時內有效（到 ${p.expires_at}），共 ${p.objects} 個物件。` + (p.note ? ' ' + p.note : '')));
      s.append(el('div', { class: 'links' }, el('a', { href: url('files/' + job.job_id + '/manifest.json') }, '本機 manifest.json')));
    } else if (p.status === 'skipped') {
      s.append(el('div', { class: 'note' }, p.note || '未發佈'));
    } else {
      s.append(el('div', { class: 'errbox' }, p.error || '發佈失敗'));
    }
    if (job.warnings && job.warnings.length) s.append(el('div', { class: 'note' }, '提醒', el('ul', {}, job.warnings.map((w) => el('li', {}, w)))));
  }

  // ------------------------------------------------------------ one section per image
  const sections = {};

  function section(job, n) {
    let ctx = sections[job.job_id];
    if (ctx) return ctx;
    const root = el('section', { class: 'job', id: 'job-' + n });
    const head = el('h2', {});
    const share = el('div', { class: 'share' });
    const grid = el('div', { class: 'grid' });
    const units = el('details', { hidden: 'hidden' }, el('summary', {}, 'Mode A units（JSON，每個 attempt 的最後選用版）'), el('pre'));
    root.append(head, share, el('div', { class: 'scroller' }, grid), units);
    $('jobs').append(root);
    ctx = { n, root, head, share, grid, units, seen: {}, gridKey: null, showFrames: false };
    sections[job.job_id] = ctx;
    return ctx;
  }

  function changed(ctx, key, value) {
    const s = JSON.stringify(value);
    if (ctx.seen[key] === s) return false;
    ctx.seen[key] = s;
    return true;
  }

  function ensureGrid(job, ctx) {
    const results = job.mode_b.results || [];
    const key = JSON.stringify([job.mode_a.status === 'skipped', results.length]);
    if (ctx.gridKey === key) return;
    ctx.gridKey = key;
    ctx.seen = {};
    ctx.grid.replaceChildren();
    const col = (cls) => ctx.grid.append(el('article', { class: 'col ' + cls }));
    col('c-orig');
    if (job.mode_a.status !== 'skipped') col('c-a');
    results.forEach((_, i) => col('c-b-' + i));
  }

  function renderJob(job, n) {
    const ctx = section(job, n);
    ensureGrid(job, ctx);
    const cols = (cls) => ctx.grid.querySelector('.' + cls);
    if (changed(ctx, 'head', [job.image.name, job.status])) ctx.head.textContent = '圖片 ' + n + (job.image.name ? ' · ' + job.image.name : '');
    // re-render a column only when its data changed, so pictures do not flicker while polling
    if (changed(ctx, 'orig', [job.image, job.mode_a.units, job.mode_a.page])) renderOriginal(job, cols('c-orig'), ctx);
    if (job.mode_a.status !== 'skipped' && changed(ctx, 'a', [job.mode_a, job.params.verify_details])) renderA(job, cols('c-a'));
    (job.mode_b.results || []).forEach((r, i) => { if (changed(ctx, 'b' + i, [r, job.params.verify_details])) renderB(job, i, cols('c-b-' + i)); });
    if (changed(ctx, 'share', [job.status, job.publish, job.warnings])) renderShare(job, ctx.share);
    const a = job.mode_a;
    if (changed(ctx, 'units', a.units)) {
      if (a && a.units) { ctx.units.querySelector('pre').textContent = JSON.stringify(a.units, null, 2); ctx.units.hidden = false; } else ctx.units.hidden = true;
    }
  }

  // ------------------------------------------------------------ render loop
  const top = { seen: {} };
  function render(batch) {
    $('results').hidden = false;
    if (changed(top, 'summary', [batch.summary, batch.totals, batch.job_ids])) renderSummary(batch);
    if (changed(top, 'share', [batch.status, batch.publish, batch.warnings])) renderBatchShare(batch);
    (batch.jobs || []).forEach((job, i) => renderJob(job, i + 1));
  }

  function setBusy(busy, text) {
    $('submit').disabled = busy;
    const s = $('status'); s.replaceChildren();
    if (busy) s.append(el('span', { class: 'spinner' }));
    if (text) s.append(text);
  }

  async function poll(batchId) {
    let failures = 0, doneTicks = 0;
    clearInterval(timer);
    const tick = async () => {
      try {
        const r = await fetch(url('api/batches/' + batchId), { headers: H });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const batch = await r.json();
        failures = 0;
        render(batch);
        const secs = Math.round((Date.now() - startedAt) / 1000);
        const settled = ['done', 'skipped', 'error'].includes((batch.publish || {}).status);
        if (batch.status === 'done') {
          setBusy(false, '完成，共 ' + secs + ' 秒' + (settled ? '' : '（正在上傳給審閱者的連結…）'));
          if (settled || ++doneTicks > 180) clearInterval(timer);  // the upload gets ~4.5 minutes
        } else setBusy(true, '處理中… 已 ' + secs + ' 秒（' + (batch.jobs || []).filter((j) => j.status === 'done').length + ' / ' + batch.job_ids.length + ' 張完成）');
      } catch (e) {
        if (++failures >= 8) { clearInterval(timer); setBusy(false, '與伺服器失聯：' + e.message); }
      }
    };
    timer = setInterval(tick, 1500);
    tick();
  }

  $('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const files = Array.from($('file').files);
    if (!files.length) return;
    if (files.length > MAX_BATCH) { setBusy(false, '一次最多 ' + MAX_BATCH + ' 張圖，你選了 ' + files.length + ' 張'); return; }
    const useA = $('mode-a').checked, useB = $('mode-b').checked;
    if (!useA && !useB) { setBusy(false, '請至少勾選一個 Mode'); return; }
    if (useB && !picker.selected.length) { setBusy(false, '請至少選一個影像模型'); return; }
    const fd = new FormData();
    for (const f of files) fd.append('files', f);
    fd.append('target_lang', $('lang').value);
    fd.append('mode_a', useA ? '1' : '0');
    fd.append('mode_b', useB ? '1' : '0');
    fd.append('mode_a_retry', $('mode-a-retry').checked ? '1' : '0');
    for (const m of picker.selected) fd.append('image_models', m);
    fd.append('output_size', $('size').value);
    fd.append('runs', $('runs').value);
    fd.append('judge', $('judge').checked ? '1' : '0');
    fd.append('verify', '1');
    fd.append('verify_details', $('details').checked ? '1' : '0');
    setBusy(true, '上傳中…');
    startedAt = Date.now();
    try {
      const r = await fetch(url('api/batches'), { method: 'POST', body: fd, headers: H });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.detail || 'HTTP ' + r.status);
      $('jobs').replaceChildren();
      for (const k of Object.keys(sections)) delete sections[k];
      top.seen = {};
      poll(body.batch_id);
    } catch (e) { setBusy(false, '送出失敗：' + e.message); }
  });

  loadModels();
})();
</script>
</body>
</html>
