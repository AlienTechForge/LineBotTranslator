<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Lab</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1f23; --muted: #646a73; --line: #dcd9d0;
    --accent: #1f5fbf; --accent-ink: #ffffff; --ok: #1f7a3f; --warn: #a86400; --err: #b3261e;
    --err-bg: #fdecea; --warn-bg: #fff3dc; --ok-bg: #e6f4ea; --code: #f0eee8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1d2026; --ink: #e8e9ec; --muted: #9aa0aa; --line: #343841;
      --accent: #6aa3ff; --accent-ink: #0b1220; --ok: #5fcf8a; --warn: #f0b04a; --err: #ff8a80;
      --err-bg: #3a1c1a; --warn-bg: #3a2c12; --ok-bg: #16301f; --code: #262a31;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Noto Sans CJK TC", "Noto Sans TC", sans-serif; }
  header, main { max-width: 1480px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 20px; }
  main { padding-bottom: 40px; }
  h1 { margin: 0; font-size: 22px; }
  .sub { margin: 4px 0 16px; color: var(--muted); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px;
           background: var(--warn); color: #fff; margin-left: 8px; vertical-align: middle; }
  form, .col, details, .share { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  form { padding: 14px 16px; display: grid; gap: 12px 20px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); align-items: start; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: 13px; }
  label.check { display: flex; gap: 8px; align-items: center; font-weight: 500; font-size: 14px; }
  select, input[type=file], input[type=text], input[type=search] { width: 100%; padding: 6px; border: 1px solid var(--line); border-radius: 6px;
                              background: var(--bg); color: var(--ink); font: inherit; }
  button { padding: 9px 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
           font: inherit; font-weight: 600; cursor: pointer; }
  button.small { padding: 5px 12px; font-size: 13px; }
  button:disabled { opacity: .55; cursor: progress; }
  .hint { font-weight: 400; font-size: 12px; color: var(--muted); }
  #status { grid-column: 1 / -1; color: var(--muted); min-height: 1.5em; display: flex; gap: 8px; align-items: center; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
             border-radius: 50%; animation: spin 0.9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .models { grid-column: span 2; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 0; min-width: 0; }
  @media (max-width: 640px) { .models { grid-column: auto; } }
  .models legend { font-weight: 600; font-size: 13px; padding: 0 6px; }
  #model-list { max-height: 176px; overflow: auto; margin-top: 6px; display: grid; gap: 2px; }
  .mrow { display: flex; gap: 8px; align-items: center; font-weight: 500; font-size: 13px; padding: 1px 2px; }
  .mrow.off { opacity: .5; }
  .mtag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 6px; white-space: nowrap; }
  #model-count { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #results { margin-top: 18px; }
  .share { padding: 10px 14px; margin-bottom: 14px; display: grid; gap: 6px; }
  .share .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .share input { flex: 1 1 320px; min-width: 0; font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .scroller { overflow-x: auto; padding-bottom: 8px; }
  .grid { display: flex; gap: 14px; align-items: flex-start; }
  .col { padding: 12px; min-width: 320px; flex: 1 0 320px; max-width: 560px; }
  .col h2 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .col h2 .mname { word-break: break-all; }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
  .pill.done { color: var(--ok); border-color: var(--ok); }
  .pill.running, .pill.pending { color: var(--warn); border-color: var(--warn); }
  .pill.error { color: var(--err); border-color: var(--err); }
  .verdict { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 1px 9px; border-radius: 99px; border: 1px solid; white-space: nowrap; }
  .v-pass { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); }
  .v-partial { color: var(--warn); background: var(--warn-bg); border-color: var(--warn); }
  .v-garbled, .v-garbled-partial { color: var(--err); background: var(--err-bg); border-color: var(--err); border-style: dashed; }
  .v-digits-changed, .v-digits-changed-partial, .v-digits-changed-garbled, .v-digits-changed-garbled-partial { color: var(--err); background: var(--err-bg); border-color: var(--err); }
  .v-garbled-partial, .v-digits-changed-partial { border-width: 2px; }
  .v-digits-changed-garbled, .v-digits-changed-garbled-partial { border-width: 3px; }
  .v-unverified, .v-none { color: var(--muted); background: var(--code); border-color: var(--line); }
  .imgbox { position: relative; border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
            background: repeating-conic-gradient(var(--code) 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
  .imgbox img { display: block; width: 100%; height: auto; }
  .imgbox svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 10px 0 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; word-break: break-word; }
  .links { margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
  a { color: var(--accent); }
  .errbox { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: var(--err-bg); color: var(--err);
            border: 1px solid var(--err); white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  .note { margin-top: 8px; font-size: 12.5px; color: var(--warn); }
  .note ul { margin: 4px 0 0; padding-left: 18px; }
  .words { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-word; }
  details { margin-top: 14px; padding: 10px 14px; }
  .col details { margin-top: 10px; padding: 6px 10px; }
  summary { cursor: pointer; font-weight: 600; font-size: 13.5px; }
  pre { margin: 10px 0 0; padding: 10px; background: var(--code); border-radius: 6px; overflow: auto;
        max-height: 520px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
  .toggle { margin-top: 8px; font-size: 13px; }
  .judge { margin-top: 8px; }
  .seg { margin-top: 8px; font-size: 13px; }
  .seg ul { margin: 4px 0 0; padding-left: 18px; }
  .seg .src { color: var(--muted); }
  .softrun { color: var(--warn); }
  #summary { margin-bottom: 14px; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .tablewrap { overflow-x: auto; max-width: 100%; }
  .summary-table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 13px; }
  .summary-table th, .summary-table td { text-align: left; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .summary-table th { color: var(--muted); font-weight: 600; }
  .summary-table .vlist { display: flex; gap: 4px; flex-wrap: wrap; }
  .runs-table { border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  .runs-table th, .runs-table td { text-align: left; padding: 2px 10px 2px 0; }
  .empty { padding: 28px 8px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body data-default-model="{{ default_image_model }}" data-max-models="{{ max_models }}">
<header>
  <h1>Overlay Lab{% if mock %}<span class="badge">LAB_MOCK=1</span>{% endif %}</h1>
  <p class="sub">圖片翻譯 overlay 的離線對照實驗：影像模型整張重畫（Mode B，主線，可同時比較多個模型、每個模型連跑多次，並自動驗證數字、漏翻與亂碼）對 hybrid（Mode A，Vision 字框 + Claude 分組 + inpaint + 重繪，選用）。不是正式服務。</p>
</header>
<main>
  <form id="form">
    <label>圖片（jpg / png / webp，最大 {{ max_upload_mb }} MB）
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp" required>
    </label>
    <label>目標語言
      <select id="lang">
        {% for code, name in languages.items() %}<option value="{{ code }}"{% if code == 'en' %} selected{% endif %}>{{ code }} — {{ name }}</option>{% endfor %}
      </select>
    </label>
    <div>
      <label class="check"><input type="checkbox" id="mode-b" checked> Mode B（影像模型，主線）</label>
      <label class="check"><input type="checkbox" id="mode-a"> Mode A（hybrid，{{ claude_model }}，選用）</label>
    </div>
    <fieldset class="models" id="models-box">
      <legend>Mode B 影像模型（最多 {{ max_models }} 個，同時平行執行）</legend>
      <input type="search" id="model-filter" placeholder="篩選模型 id…" aria-label="篩選模型 id" autocomplete="off">
      <div id="model-list" role="group" aria-label="Mode B 影像模型"></div>
      <div id="model-count"></div>
    </fieldset>
    <label>輸出尺寸
      <select id="size">
        <option value="default">預設（不送，用供應商的尺寸）</option>
        {% for s in output_sizes %}<option value="{{ s }}"{% if s == default_output_size %} selected{% endif %}>{{ s }}</option>{% endfor %}
      </select>
      <span class="hint">送出 OpenRouter Image API 文件上的 <code>resolution</code> 參數，只對 images 路徑生效；chat 路徑沒有文件化的尺寸參數，會顯示「未套用」。</span>
    </label>
    <label>每個模型連跑 N 次
      <select id="runs">
        {% for n in range(1, max_runs + 1) %}<option value="{{ n }}"{% if n == 1 %} selected{% endif %}>{{ n }}</option>{% endfor %}
      </select>
      <span class="hint">每次都是獨立的一輪（各自的重試、驗證與 judge），每輪一欄，並算出各模型的通過率。同時最多 {{ max_generations }} 個生成在跑，其餘排隊；429 會等 20 秒再試一次。費用大約是 N 倍。</span>
    </label>
    <label class="check"><input type="checkbox" id="judge" checked> 語意審查（Claude judge：{{ judge_model }}，每次嘗試一次呼叫）</label>
    <label class="check"><input type="checkbox" id="details"> 顯示驗證細節（展開面板，並附上輸出圖的 OCR 全文）</label>
    <button type="submit" id="submit">開始</button>
    <div id="status" role="status"></div>
  </form>

  <section id="results" hidden>
    <div class="share" id="share"></div>
    <div id="summary" hidden></div>
    <div class="scroller"><div class="grid" id="grid"></div></div>
    <details id="units-panel" hidden><summary>Mode A units（JSON）</summary><pre id="units-json"></pre></details>
  </section>
</main>

<script>
(() => {
  const TOKEN = new URLSearchParams(location.search).get('token') || '';
  const H = TOKEN ? { 'X-Lab-Token': TOKEN } : {};
  const url = (u) => TOKEN ? u + (u.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN) : u;
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) { if (k === 'class') n.className = v; else n.setAttribute(k, v); }
    for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : document.createTextNode(String(k)));
    return n;
  };
  const SVGNS = 'http://www.w3.org/2000/svg';
  const DEFAULT_MODEL = document.body.dataset.defaultModel;
  const MAX_MODELS = parseInt(document.body.dataset.maxModels, 10) || 4;
  const fmtMs = (ms) => ms == null ? '—' : (ms >= 1000 ? (ms / 1000).toFixed(1) + ' s' : ms + ' ms');
  const fmtUsd = (v) => v == null ? '—' : '$' + (v < 0.01 ? v.toFixed(5) : v.toFixed(4));
  let showFrames = false, timer = null, startedAt = 0, gridJob = null;

  // ------------------------------------------------------------ model picker (up to MAX_MODELS)
  const picker = { all: [], details: {}, selected: [DEFAULT_MODEL] };

  function renderPicker() {
    const filter = $('model-filter').value.trim().toLowerCase();
    const list = $('model-list');
    list.replaceChildren();
    const full = picker.selected.length >= MAX_MODELS;
    const order = [...picker.selected, ...picker.all.filter((id) => !picker.selected.includes(id))];
    for (const id of order) {
      const on = picker.selected.includes(id);
      if (!on && filter && !id.toLowerCase().includes(filter)) continue;
      const d = picker.details[id] || {};
      const cb = el('input', { type: 'checkbox', value: id });
      cb.checked = on;
      cb.disabled = !on && full;
      cb.addEventListener('change', () => {
        picker.selected = cb.checked ? [...picker.selected, id] : picker.selected.filter((x) => x !== id);
        renderPicker();
      });
      const row = el('label', { class: 'mrow' + (cb.disabled ? ' off' : '') }, cb, el('span', {}, id));
      if (d.preferred_route === 'images') row.append(el('span', { class: 'mtag', title: '先走 /api/v1/images，失敗再走 chat' }, 'images 優先'));
      if (d.input_image === false) row.append(el('span', { class: 'mtag' }, '僅文字輸入'));
      list.append(row);
    }
    $('model-count').textContent = '已選 ' + picker.selected.length + ' / ' + MAX_MODELS + (picker.selected.length ? '：' + picker.selected.join('、') : '');
  }

  async function loadModels() {
    renderPicker();
    try {
      const r = await fetch(url('api/image-models'), { headers: H });
      const data = await r.json();
      picker.all = data.models || [];
      picker.details = data.details || {};
      if (data.default && !picker.selected.length) picker.selected = [data.default];
      renderPicker();
      if (data.error) $('status').textContent = '模型清單載入失敗，只列出預設模型：' + data.error;
    } catch (e) { /* the default model from the page stays */ }
  }
  $('model-filter').addEventListener('input', renderPicker);

  // ------------------------------------------------------------ small DOM helpers
  function row(dl, k, v) { if (v === undefined || v === null || v === '') return; dl.append(el('dt', {}, k), el('dd', {}, v)); }
  function pill(status) { return el('span', { class: 'pill ' + status }, { pending: '等待', running: '執行中', done: '完成', error: '失敗', skipped: '未執行' }[status] || status); }
  // appended only when there is a message (DOM append(null) would print the word "null")
  function addErr(parent, msg) { if (msg) parent.append(el('div', { class: 'errbox' }, msg)); }
  function dlLink(job, name, label) { return el('a', { href: url('files/' + job.job_id + '/' + name + '?dl=1') }, label); }
  function imgBox(src) { const img = el('img', { src: url(src), alt: '' }); return el('div', { class: 'imgbox' }, img); }

  const VERDICTS = {
    'pass': ['pass', '數字、語言與語意都過關'],
    'partial': ['partial', '有來源語言的字沒翻掉（比例超過門檻，或有一個大字沒翻）'],
    'garbled': ['garbled', '輸出裡有亂碼（不是真的字），或 judge 的完成度低於 0.90'],
    'garbled+partial': ['garbled+partial', '有亂碼，而且還有漏翻'],
    'digits-changed': ['digits-changed', '來源圖上（高信心）的數字有被改掉或遺失'],
    'digits-changed+partial': ['digits-changed+partial', '數字被改，而且還有漏翻'],
    'digits-changed+garbled': ['digits-changed+garbled', '數字被改，而且有亂碼'],
    'digits-changed+garbled+partial': ['digits-changed+garbled+partial', '數字被改、有亂碼、還有漏翻'],
    'unverified': ['unverified', '驗證本身沒跑成功（看驗證錯誤）'],
  };
  const covText = (c) => (Math.floor(c * 100) / 100).toFixed(2);  // 0.996 shows as 0.99, never as a rounded-up 1.00
  // the verdict, plus the judge's coverage when it is below 1 (e.g. "pass · 0.97")
  function verdictBadge(verdict, pending, coverage) {
    if (!verdict) return el('span', { class: 'verdict v-none', title: pending ? '驗證進行中' : '沒有驗證' }, pending ? '驗證中…' : '未驗證');
    const [text, tip] = VERDICTS[verdict] || [verdict, ''];
    const cov = typeof coverage === 'number' && coverage < 1 ? ' · ' + covText(coverage) : '';
    return el('span', { class: 'verdict v-' + verdict.replace(/[^a-z]+/g, '-'), title: tip + (cov ? '（judge 完成度 ' + covText(coverage) + '）' : '') }, text + cov);
  }
  const coverageOf = (t) => (t && t.verification && typeof t.verification.coverage === 'number') ? t.verification.coverage : null;

  // ------------------------------------------------------------ columns
  function renderOriginal(job) {
    const c = $('col-orig'); c.replaceChildren();
    c.append(el('h2', {}, '原圖'));
    const box = imgBox(job.image.url);
    c.append(box);
    const a = job.mode_a;
    if (a && a.units && a.units.length) {
      const svg = document.createElementNS(SVGNS, 'svg');
      const [pw, ph] = a.page || [job.image.width, job.image.height];
      svg.setAttribute('viewBox', `0 0 ${pw} ${ph}`);
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.style.display = showFrames ? '' : 'none';
      const colors = { translated: '#1f6fe0', kept: '#1f9a50', skipped: '#999' };
      for (const u of a.units) {
        const poly = document.createElementNS(SVGNS, 'polygon');
        poly.setAttribute('points', u.frame.map((p) => p.join(',')).join(' '));
        poly.setAttribute('fill', 'none');
        poly.setAttribute('stroke', colors[u.action] || '#999');
        poly.setAttribute('stroke-width', Math.max(2, pw / 400));
        svg.append(poly);
        const t = document.createElementNS(SVGNS, 'text');
        t.setAttribute('x', u.frame[0][0]); t.setAttribute('y', u.frame[0][1]);
        t.setAttribute('font-size', Math.max(10, pw / 60)); t.setAttribute('fill', colors[u.action] || '#999');
        t.textContent = u.id;
        svg.append(t);
      }
      box.append(svg);
      const cb = el('input', { type: 'checkbox' });
      cb.checked = showFrames;
      cb.addEventListener('change', () => { showFrames = cb.checked; svg.style.display = showFrames ? '' : 'none'; });
      c.append(el('label', { class: 'check toggle' }, cb, '疊上 Mode A 的 unit 框（藍：翻譯／綠：保留／灰：略過）'));
    }
    const dl = el('dl'); row(dl, '尺寸', job.image.width + ' × ' + job.image.height + ' px'); row(dl, '目標語言', job.params.target_lang);
    c.append(dl);
  }

  function renderA(job) {
    const c = $('col-a'); c.replaceChildren();
    const a = job.mode_a;
    c.append(el('h2', {}, 'Mode A', pill(a.status)));
    if (a.output) c.append(imgBox('files/' + job.job_id + '/' + a.output + '?v=' + (a.elapsed_ms || 0)));
    else if (a.status !== 'error') c.append(el('div', { class: 'empty' }, '處理中…'));
    if (a.status === 'done') {
      const dl = el('dl');
      row(dl, '總耗時', fmtMs(a.elapsed_ms));
      row(dl, 'Vision', fmtMs(a.vision_ms));
      row(dl, 'Claude', fmtMs(a.claude_ms));
      row(dl, 'erase / render', fmtMs(a.erase_ms) + ' / ' + fmtMs(a.render_ms));
      row(dl, 'tokens (in / out)', a.tokens.input + ' / ' + a.tokens.output);
      row(dl, '估計費用', a.cost_usd == null ? '（未知模型，只顯示 tokens）' : fmtUsd(a.cost_usd));
      row(dl, 'units', `${a.translated_count} 翻譯 / ${a.unit_count} 共 / ${a.word_count} 字`);
      row(dl, '模型', a.served_model && a.served_model !== a.model ? `${a.model}（實際：${a.served_model}）` : a.model);
      row(dl, 'fallback 形式', a.fallback_form);
      c.append(dl);
      const links = el('div', { class: 'links' }, dlLink(job, a.output, '下載 PNG'), dlLink(job, a.erased, '下載僅擦除版'));
      c.append(links);
      if (a.warnings && a.warnings.length) c.append(el('div', { class: 'note' }, '提醒', el('ul', {}, a.warnings.map((w) => el('li', {}, w)))));
      const over = (a.units || []).filter((u) => u.overflowed).length;
      if (over) c.append(el('div', { class: 'note' }, over + ' 個 unit 超出框（見 JSON 面板的 overflowed）'));
    }
    addErr(c, a.error);
  }

  function sizeNote(b, t) {
    if (!b.resolution_requested) return '預設';
    if (t.resolution_applied) return b.resolution_requested + '（已套用，images 路徑 resolution）';
    if ((t.api_used || '').startsWith('chat')) return b.resolution_requested + '（未套用：chat 路徑沒有文件化的尺寸參數）';
    if ((t.api_used || '').includes('no resolution')) return b.resolution_requested + '（未套用：供應商拒絕 resolution，已略過）';
    return b.resolution_requested + '（未套用）';
  }

  // the checks of one attempt: missing digit runs, leftover words, ratio
  function verificationPanel(job, b, t, open) {
    const v = t.verification;
    const d = el('details', { class: 'vdetail' });
    if (open) d.open = true;
    d.append(el('summary', {}, '驗證細節'));
    if (!v) {
      d.append(el('div', { class: 'note' }, t.verify_error ? '驗證沒跑成功：' + t.verify_error : (b.status === 'running' ? '驗證進行中…' : '沒有驗證結果')));
      return d;
    }
    const dl = el('dl');
    row(dl, '判定', verdictBadge(v.verdict, false, v.coverage));
    row(dl, '來源語言', (v.source_language || '（無法判斷）') + (v.source_language_method ? '（' + (v.source_language_method === 'detected' ? 'Vision 偵測' : '文字 script 推斷') + '）' : '') + ' → ' + v.target_language);
    const soft = v.soft_digit_runs || 0;
    row(dl, '數字', v.digits_ok ? `沒有遺失（來源有 ${v.source_digit_runs} 組 2 位以上的數字${soft ? `，其中 ${soft} 組是低信心的手寫／小字` : ''}）` : `遺失或被改 ${v.missing_digit_runs.length} 組 / 共 ${v.source_digit_runs} 組`);
    if (!v.digits_ok) {
      row(dl, '缺少的數字', el('span', { class: 'words' }, (v.missing_digit_details || []).map((m) => m.as_written).join('、') || v.missing_digit_runs.join('、')));
    }
    if (v.unverified_digit_runs && v.unverified_digit_runs.length) {
      row(dl, '無法確認的數字', el('span', { class: 'words softrun', title: '來源圖的 OCR 信心低於 ' + v.thresholds.soft_confidence_max + '（手寫或很小的字），Vision 可能讀錯；不計入判定，請用肉眼確認' },
        '⚠ ' + (v.unverified_digit_details || []).map((m) => `${m.as_written}（信心 ${m.confidence}）`).join('、')));
    }
    row(dl, '殘留比例', `${(v.leftover_ratio * 100).toFixed(1)}%（門檻 ${(v.thresholds.leftover_ratio_max * 100).toFixed(0)}%；${v.leftover_count} / ${v.source_language_words} 個來源語言的字）`);
    if (v.leftover_words && v.leftover_words.length) row(dl, '殘留的字', el('span', { class: 'words' }, v.leftover_words.join('、')));
    if (v.big_leftover_words && v.big_leftover_words.length) {
      row(dl, '大字沒翻', el('span', { class: 'words' }, v.big_leftover_words.map((b) => `「${b.word}」高 ${b.height}px，是輸出字高中位數 ${b.median_height}px 的 ${b.ratio} 倍`).join('；') + `（超過 ${v.thresholds.big_glyph_ratio} 倍就判 partial，不看比例）`));
    }
    const j = v.judge;
    if (j && j.status === 'ok') {
      row(dl, '語意審查 coverage', `${covText(j.coverage)}（${j.coverage < v.thresholds.coverage_min ? '低於' : '達到'}門檻 ${v.thresholds.coverage_min.toFixed(2)}）　${j.served_model || j.model}　${fmtMs(j.elapsed_ms)}　${j.cost_usd == null ? '（未知模型，只有 tokens）' : fmtUsd(j.cost_usd)}`);
      row(dl, 'judge 摘要', j.summary);
    } else if (j) {
      row(dl, '語意審查', el('span', { class: 'softrun' }, 'judge: ' + (j.status === 'skipped' ? 'skipped（' + (j.note || '') + '）' : 'unavailable' + (j.error ? '：' + j.error : '') + '——只用 OCR 檢查判定')));
    } else {
      row(dl, '語意審查', '沒有開');
    }
    row(dl, '驗證耗時', fmtMs(t.verify_ms));
    d.append(dl);
    if (v.note) d.append(el('div', { class: 'note' }, v.note));
    if (j && j.status === 'ok') {
      const seg = (title, items, fmt) => (items && items.length)
        ? el('div', { class: 'seg' }, el('strong', {}, title + '（' + items.length + '）'), el('ul', {}, items.map((x) => el('li', {}, fmt(x))))) : null;
      const pair = (x) => [el('span', {}, '「' + x.output_text + '」'), x.source_text ? el('span', { class: 'src' }, ' ← 原文「' + x.source_text + '」') : null, x.problem ? el('span', { class: 'src' }, '　' + x.problem) : null];
      const lists = [
        seg('亂碼（不是真的字）', j.garbled_segments, pair),
        seg('沒翻（仍是來源語言）', j.untranslated_segments, (x) => '「' + x + '」'),
        seg('翻錯（意思不同）', j.mistranslated_segments, pair),
        seg('數字被改（judge 的看法，不影響判定）', j.altered_numbers, (x) => `原文 ${x.source} → 輸出 ${x.output}`),
      ].filter(Boolean);  // append(null) would print the word "null"
      lists.forEach((n) => d.append(n));
      if (!lists.length) d.append(el('div', { class: 'hint' }, 'judge 沒有列出任何問題段落。'));
      if (j.reference_translation && j.reference_translation.length) {
        d.append(el('details', { class: 'refbox' }, el('summary', {}, 'judge 的參考翻譯（' + j.reference_translation.length + ' 行，依來源圖的閱讀順序）'), el('pre', {}, j.reference_translation.join('\n'))));
      }
    }
    if (v.digit_runs && v.digit_runs.length) {
      const statusText = { ok: '找到', near: '找到（差 1 位）', unverified: '沒找到（低信心，只提醒）', missing: '遺失' };
      const table = el('table', { class: 'runs-table' }, el('thead', {}, el('tr', {}, ['數字', 'OCR 信心', '類型', '結果'].map((h) => el('th', {}, h)))),
        el('tbody', {}, v.digit_runs.map((r) => el('tr', {}, el('td', {}, r.as_written), el('td', {}, String(r.confidence)), el('td', {}, r.soft ? '軟（< ' + v.thresholds.soft_confidence_max + '）' : '硬'),
          el('td', {}, (statusText[r.status] || r.status) + (r.matched ? '：' + r.matched : ''))))));
      d.append(el('details', {}, el('summary', {}, '數字明細（' + v.digit_runs.length + ' 組）'), table));
    }
    if (t.verification_file) d.append(el('div', { class: 'links' }, dlLink(job, t.verification_file, '下載驗證 JSON')));
    if (v.output_text != null) {
      d.append(el('details', {}, el('summary', {}, '輸出圖的 OCR 全文'), el('pre', {}, v.output_text || '（沒有辨識到文字）')));
    }
    return d;
  }

  function tryBlock(job, b, t) {
    const d = el('details', { class: 'attempt' });
    d.append(el('summary', {}, `嘗試 ${t.n}（${t.selected ? '採用' : '未採用'}）　`, verdictBadge(t.verdict, b.status === 'running', coverageOf(t)), `　${fmtMs((t.elapsed_ms || 0) + (t.verify_ms || 0))}　${fmtUsd(t.cost_usd)}`));
    d.append(imgBox('files/' + job.job_id + '/' + t.output));
    const dl = el('dl');
    row(dl, 'API 路徑', t.api_used);
    row(dl, '輸出尺寸', t.output_size.join(' × ') + ' px（長寬比差 ' + t.aspect_drift_pct + '%）');
    row(dl, '生成耗時', fmtMs(t.elapsed_ms));
    d.append(dl);
    if (t.n > 1 && t.prompt) d.append(el('details', {}, el('summary', {}, '這次送出的 prompt'), el('pre', {}, t.prompt)));
    d.append(verificationPanel(job, b, t, false));
    d.append(el('div', { class: 'links' }, dlLink(job, t.output, '下載 PNG')));
    return d;
  }

  function renderB(job, i) {
    const b = job.mode_b.results[i];
    const c = $('col-b-' + i); c.replaceChildren();
    const tries = b.tries || [];
    const main = tries.find((t) => t.selected) || tries[0];
    const checking = b.status === 'running' && b.verify;
    const runTag = (b.runs || 1) > 1 ? ' · run ' + b.run : '';
    c.append(el('h2', {}, el('span', { class: 'mname' }, 'Mode B · ' + b.model + runTag), pill(b.status), main || b.status === 'running' ? verdictBadge(b.verdict, checking, coverageOf(main)) : null));
    if (b.output) c.append(imgBox('files/' + job.job_id + '/' + b.output));
    else if (b.status !== 'error') c.append(el('div', { class: 'empty' }, '處理中…'));
    if (b.output && main) {
      const dl = el('dl');
      row(dl, '耗時（含驗證與重試）', fmtMs(b.elapsed_ms) + (tries.length > 1 ? `（生成 ${fmtMs(b.generation_ms)} + 驗證 ${fmtMs(b.verify_ms)}）` : ''));
      row(dl, 'API 路徑', b.api_used + '　（優先：' + b.route_preference + '）');
      const u = b.usage || {};
      if (u.prompt_tokens != null || u.completion_tokens != null) row(dl, 'tokens (in / out)', (u.prompt_tokens ?? '—') + ' / ' + (u.completion_tokens ?? '—') + (tries.length > 1 ? '（兩次合計）' : ''));
      row(dl, '費用（生成）', b.cost_usd == null ? '（回應沒有帶 cost）' : fmtUsd(b.cost_usd) + (tries.length > 1 ? '（兩次合計：' + tries.map((t) => fmtUsd(t.cost_usd)).join(' + ') + '）' : ''));
      if (b.judge) row(dl, '費用（judge）', b.judge_cost_usd == null ? '（沒有，judge 不可用或未知模型）' : fmtUsd(b.judge_cost_usd) + (tries.length > 1 ? '（' + tries.map((t) => fmtUsd(t.judge_cost_usd)).join(' + ') + '）' : ''));
      row(dl, '費用（合計）', fmtUsd(b.total_cost_usd));
      row(dl, '輸出尺寸', b.output_size.join(' × ') + ' px（長寬比差 ' + b.aspect_drift_pct + '%）');
      row(dl, '尺寸選項', sizeNote(b, main));
      if (tries.length > 1) row(dl, '自動重試', `嘗試 1 是 ${tries[0].verdict || '—'}，已重試；採用嘗試 ${b.selected_attempt}`);
      c.append(dl);
      c.append(el('div', { class: 'links' }, dlLink(job, b.output, '下載 PNG')));
      if (b.verify) c.append(verificationPanel(job, b, main, job.params.verify_details));
      if (b.model_text) c.append(el('div', { class: 'note' }, '模型附帶文字：' + b.model_text));
      if (b.route_errors && b.route_errors.length) c.append(el('div', { class: 'note' }, '先前的嘗試', el('ul', {}, b.route_errors.map((w) => el('li', {}, w)))));
      for (const t of tries) if (!t.selected) c.append(tryBlock(job, b, t));  // the other attempt, collapsed
    }
    addErr(c, b.error);
    addErr(c, b.retry_error ? '自動重試失敗（沿用嘗試 1）：' + b.retry_error : null);
    addErr(c, b.verify_error ? '驗證失敗：' + b.verify_error : null);
  }

  // ------------------------------------------------------------ batch summary (one row per model)
  function renderSummary(job) {
    const box = $('summary'); box.replaceChildren();
    const rows = (job.mode_b && job.mode_b.summary) || [];
    if (!rows.length || (job.params.runs || 1) < 2) { box.hidden = true; return; }
    box.hidden = false;
    box.append(el('strong', {}, '各模型彙總（每個模型連跑 ' + job.params.runs + ' 次；通過率 = 判定為 pass 的 run 數 ÷ 已結束的 run 數，失敗的 run 算沒過）'));
    const table = el('table', { class: 'summary-table' });
    table.append(el('thead', {}, el('tr', {}, ['模型', '通過率', '各次判定', '平均總費用', '平均總時間', '最佳 run'].map((h) => el('th', {}, h)))));
    const body = el('tbody');
    for (const s of rows) {
      const finished = s.runs_done + s.runs_failed;
      const verdicts = (s.verdicts || []).map((v) => VERDICTS[v] ? verdictBadge(v) : el('span', { class: 'pill ' + (v === 'error' ? 'error' : 'running') }, { error: '失敗', pending: '等待', running: '執行中' }[v] || String(v)));
      body.append(el('tr', {},
        el('td', {}, el('span', { class: 'mname' }, s.model)),
        el('td', {}, s.pass_rate == null ? '—' : `${s.passes} / ${finished}（${Math.round(s.pass_rate * 100)}%）` + (s.runs_live ? `，還有 ${s.runs_live} 個在跑` : '')),
        el('td', {}, el('div', { class: 'vlist' }, verdicts)),
        el('td', {}, fmtUsd(s.mean_total_cost_usd)),
        el('td', {}, fmtMs(s.mean_elapsed_ms)),
        el('td', {}, s.best_run == null ? '—' : ['run ' + s.best_run + ' ', verdictBadge(s.best_verdict)])));
    }
    table.append(body);
    box.append(el('div', { class: 'tablewrap' }, table));  // scrolls inside the box on a phone, never the page
    box.append(el('div', { class: 'hint' }, '費用與時間是每個 run 的總和（含重試、驗證與 judge）再取平均，只算完成的 run。'));
  }

  // ------------------------------------------------------------ the reviewer link
  function copyText(text, button) {
    const done = () => { const old = button.textContent; button.textContent = '已複製'; setTimeout(() => { button.textContent = old; }, 1500); };
    const fallback = () => {
      const t = el('textarea', { style: 'position:fixed;opacity:0' }); t.value = text; document.body.append(t); t.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* the field stays selectable */ } t.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }

  function renderShare(job) {
    const s = $('share'); s.replaceChildren();
    const p = job.publish || { status: 'pending' };
    s.append(el('strong', {}, '給審閱者的連結'));
    if (p.status === 'pending' || p.status === 'running') {
      s.append(el('div', { class: 'row' }, job.status === 'done' ? el('span', { class: 'spinner' }) : null, job.status === 'done' ? '上傳到 MinIO 中…' : '等所有模型跑完之後上傳'));
    } else if (p.status === 'done') {
      const input = el('input', { type: 'text', readonly: 'readonly', value: p.manifest_url, 'aria-label': '給審閱者的連結' });
      const btn = el('button', { type: 'button', class: 'small' }, '複製');
      btn.addEventListener('click', () => copyText(p.manifest_url, btn));
      input.addEventListener('focus', () => input.select());
      s.append(el('div', { class: 'row' }, input, btn));
      s.append(el('div', { class: 'hint' }, `這是 manifest.json 的連結，裡面有這次所有圖片與 JSON 的連結；${p.expiry_hours} 小時內有效（到 ${p.expires_at}），共 ${p.objects} 個物件。` + (p.note ? ' ' + p.note : '')));
      s.append(el('div', { class: 'links' }, el('a', { href: url('files/' + job.job_id + '/manifest.json') }, '本機 manifest.json')));
    } else if (p.status === 'skipped') {
      s.append(el('div', { class: 'note' }, p.note || '未發佈'));
    } else {
      s.append(el('div', { class: 'errbox' }, p.error || '發佈失敗'));
    }
    if (job.warnings && job.warnings.length) s.append(el('div', { class: 'note' }, '提醒', el('ul', {}, job.warnings.map((w) => el('li', {}, w)))));
  }

  // ------------------------------------------------------------ render loop
  const seen = {};
  function changed(key, value) {
    const s = JSON.stringify(value);
    if (seen[key] === s) return false;
    seen[key] = s;
    return true;
  }

  function ensureGrid(job) {
    const results = job.mode_b.results || [];
    const key = JSON.stringify([job.job_id, job.mode_a.status === 'skipped', results.length]);
    if (gridJob === key) return;
    gridJob = key;
    for (const k of Object.keys(seen)) delete seen[k];
    const grid = $('grid'); grid.replaceChildren();
    const col = (id) => grid.append(el('article', { class: 'col', id }));
    col('col-orig');
    if (job.mode_a.status !== 'skipped') col('col-a');
    results.forEach((_, i) => col('col-b-' + i));
  }

  function render(job) {
    $('results').hidden = false;
    ensureGrid(job);
    // re-render a column only when its data changed, so pictures do not flicker while polling
    if (changed('orig', [job.image, job.mode_a.units, job.mode_a.page])) renderOriginal(job);
    if (job.mode_a.status !== 'skipped' && changed('a', job.mode_a)) renderA(job);
    (job.mode_b.results || []).forEach((r, i) => { if (changed('b' + i, [r, job.params.verify_details])) renderB(job, i); });
    if (changed('share', [job.status, job.publish, job.warnings])) renderShare(job);
    if (changed('summary', [job.mode_b.summary, job.params.runs])) renderSummary(job);
    const a = job.mode_a, up = $('units-panel');
    if (changed('units', a.units)) {
      if (a && a.units) { $('units-json').textContent = JSON.stringify(a.units, null, 2); up.hidden = false; } else up.hidden = true;
    }
  }

  function setBusy(busy, text) {
    $('submit').disabled = busy;
    const s = $('status'); s.replaceChildren();
    if (busy) s.append(el('span', { class: 'spinner' }));
    if (text) s.append(text);
  }

  async function poll(jobId) {
    let failures = 0, doneTicks = 0;
    clearInterval(timer);
    const tick = async () => {
      try {
        const r = await fetch(url('api/jobs/' + jobId), { headers: H });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const job = await r.json();
        failures = 0;
        render(job);
        const secs = Math.round((Date.now() - startedAt) / 1000);
        const settled = ['done', 'skipped', 'error'].includes((job.publish || {}).status);
        if (job.status === 'done') {
          setBusy(false, '完成，共 ' + secs + ' 秒' + (settled ? '' : '（正在上傳給審閱者的連結…）'));
          if (settled || ++doneTicks > 180) clearInterval(timer);  // the upload gets ~4.5 minutes
        } else setBusy(true, '處理中… 已 ' + secs + ' 秒');
      } catch (e) {
        if (++failures >= 8) { clearInterval(timer); setBusy(false, '與伺服器失聯：' + e.message); }
      }
    };
    timer = setInterval(tick, 1500);
    tick();
  }

  $('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const file = $('file').files[0];
    if (!file) return;
    const useA = $('mode-a').checked, useB = $('mode-b').checked;
    if (!useA && !useB) { setBusy(false, '請至少勾選一個 Mode'); return; }
    if (useB && !picker.selected.length) { setBusy(false, '請至少選一個影像模型'); return; }
    const fd = new FormData();
    fd.append('file', file);
    fd.append('target_lang', $('lang').value);
    fd.append('mode_a', useA ? '1' : '0');
    fd.append('mode_b', useB ? '1' : '0');
    for (const m of picker.selected) fd.append('image_models', m);
    fd.append('output_size', $('size').value);
    fd.append('runs', $('runs').value);
    fd.append('judge', $('judge').checked ? '1' : '0');
    fd.append('verify', '1');
    fd.append('verify_details', $('details').checked ? '1' : '0');
    setBusy(true, '上傳中…');
    startedAt = Date.now();
    try {
      const r = await fetch(url('api/jobs'), { method: 'POST', body: fd, headers: H });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.detail || 'HTTP ' + r.status);
      poll(body.job_id);
    } catch (e) { setBusy(false, '送出失敗：' + e.message); }
  });

  loadModels();
})();
</script>
</body>
</html>
