version: '3.8'

services:
  app:
    image: ghcr.io/alientechforge/linebot-translator:latest
    container_name: linebot-translator
    restart: unless-stopped
    network_mode: "host"  # 使用宿主機網路
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=4040
      # 解決 gRPC 原生庫問題
      - GRPC_NETTY_SHADED_NETTY_TCNATIVE_DO_NOT_USE_CONSCRYPT=true
      - GRPC_NETTY_SHADED_NETTY_TCNATIVE_DO_NOT_USE_NATIVE=true
    volumes:
      - ./logs:/app/logs
      - ./linebot.json:/app/linebot.json:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4040/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
